name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src scripts

      - name: Check import layering
        run: uv run lint-imports

      - name: Test with coverage
        run: uv run pytest --cov=openalpha_cn --cov-report=term-missing --cov-fail-under=80

      - name: Build source and wheel distributions
        run: uv build

      - name: Verify generated files are synchronized
        run: git diff --exit-code

  web:
    name: Web quality and browser flow
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install locked dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependencies
        working-directory: web
        run: pnpm audit --audit-level high --registry https://registry.npmjs.org

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Unit test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

      # The `production` Playwright project starts the real ASGI application --
      # `uv run uvicorn openalpha_cn.api.app:app` -- because that is the only way to assert that
      # the *shipped* server answers a bookmarked URL, which `V2-P5-027` fixed and the dev server
      # cannot show. That command needs `uv`, and this job had never installed it: `pnpm test:e2e`
      # died at `/bin/sh: 1: uv: not found`, exit 127, before a single browser opened. It is
      # invisible locally, where `uv` is always on `PATH` -- so the suite passed for every
      # developer and had never once run here.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser golden flow
        working-directory: web
        run: pnpm test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  security:
    name: Publication and dependency security
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Verify public source boundary
        run: uv run --no-project python scripts/verify_publication.py

      - name: Verify feature destination reconciliation
        run: uv run --no-project python scripts/build_feature_coverage.py --check

      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --output-file .audit-requirements.txt

      - name: Audit Python dependencies
        run: uvx --from pip-audit pip-audit --requirement .audit-requirements.txt

  container:
    name: Container persistence recovery
    runs-on: ubuntu-latest
    # `python` is deliberately not here (`V2-P5-066`). This job is the only place the shipped
    # artifact -- the image the `Dockerfile` builds and the stack `deploy/compose.yml` starts --
    # is ever built or started, and it had never once run: the `python` matrix covers
    # `windows-latest`, `needs` cannot name a single matrix leg, and Windows had been red on
    # every dispatch, so the production verification was skipped every time. The dependency was
    # a cost heuristic ("do not spend build minutes on obviously broken code"), never a
    # correctness gate -- the signal is this job's own result. `web` and `security` still gate
    # it, and they run over the same tree.
    needs: [web, security]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Validate Compose configuration
        run: docker compose --file deploy/compose.yml config --quiet

      - name: Prove restart recovery
        run: uv run --no-project python scripts/verify_compose_recovery.py
