height="34" rx="17" fill="#8B67E8" stroke="#8B67E8" /><text x="693" y="385" class="pill" text-anchor="middle" fill="#FFFFFF">A2</text><text x="736" y="385" class="cardTitle" text-anchor="start">题材催化智能体</text><text x="670" y="424" class="body" text-anchor="start">题材 · 公告 · 催化</text><rect x="642" y="482" width="286" height="116" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="642" y="482" width="8" height="116" rx="4" fill="#A074E2"/><rect x="666" y="504" width="54" height="34" rx="17" fill="#A074E2" stroke="#A074E2" /><text x="693" y="527" class="pill" text-anchor="middle" fill="#FFFFFF">A3</text><text x="736" y="527" class="cardTitle" text-anchor="start">资金流智能体</text><text x="670" y="566" class="body" text-anchor="start">资金观察 · 确认条件</text><rect x="646" y="622" width="278" height="58" rx="18" fill="#F0EDFF" stroke="#D8D0FF" /><text x="785" y="648" class="body" text-anchor="middle">确定性基线｜无 LLM 也可运行</text><rect x="1000" y="244" width="366" height="290" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="1000" y="244" width="8" height="290" rx="4" fill="#7C5CE7"/><text x="1028" y="279" class="kicker" text-anchor="start" fill="#7C5CE7">统一结构化输出</text><text x="1028" y="316" class="cardTitle" text-anchor="start">SignalFrame</text><text x="1028" y="352" class="body" text-anchor="start">方向 · 强度 · 置信度 · 周期</text><text x="1028" y="382" class="body" text-anchor="start">evidence_ids</text><text x="1028" y="412" class="body" text-anchor="start">确认条件 / 失效条件</text><text x="1028" y="442" class="body" text-anchor="start">risk_flags</text><text x="1028" y="472" class="body" text-anchor="start">证据不足时显式 abstain</text><rect x="1000" y="562" width="366" height="102" rx="18" fill="#F7F5FF" stroke="#D8D0FF" /><text x="1026" y="595" class="cardTitle" text-anchor="start">可选 StructuredModelAgent</text><text x="1026" y="625" class="small" text-anchor="start">Schema 校验 · 有界重试 · 不覆盖证据边界</text><path d="M 314 350 L 362 350" fill="none" stroke="#7C5CE7" str