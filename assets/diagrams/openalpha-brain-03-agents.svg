  <text x="88" y="559" class="body" fill="#96A8BE" text-anchor="start" opacity="1">每个标的复用同一 runner</text>
  <text x="88" y="583" class="body" fill="#96A8BE" text-anchor="start" opacity="1">无旁路分析逻辑</text>
  <rect x="85" y="640" width="202" height="28" rx="14" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity=".38" />
  <text x="186.0" y="659" class="small" fill="#A78BFA" text-anchor="middle" opacity="1">单次 / 批量同源</text>
