  <rect width="1440" height="900" fill="url(#dots)" opacity=".36" />
  <rect x="64" y="46" width="158" height="34" rx="17" fill="#1688D4" stroke="#1688D4" />
  <text x="143" y="69" class="pill" text-anchor="middle" fill="#FFFFFF">OPENALPHA · 05</text>
  <text x="64" y="116" class="title" text-anchor="start">回放验证与研究产品｜让结果进入下一轮判断</text>
  <text x="64" y="154" class="subtitle" text-anchor="start">同路径回放、多日组合报告、事件统计检验、恢复记忆与研究产品共同构成学习闭环。</text>
