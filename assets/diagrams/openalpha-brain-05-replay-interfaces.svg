  <text x="867" y="258" class="cardTitle" text-anchor="middle">运行恢复与持久记忆</text>
  <text x="867" y="291" class="body" text-anchor="middle">Checkpoint · SQLite WAL</text>
  <text x="867" y="318" class="small" text-anchor="middle">请求 / 图签名隔离 · 幂等恢复</text>
  <rect x="724" y="370" width="286" height="118" rx="18" fill="#FFFFFF" stroke="#D7DDE8" filter="url(#shadow)" />
  <text x="867" y="406" class="cardTitle" text-anchor="middle">事件统计检验</text>
  <text x="867" y="439" class="body" text-anchor="middle">CAR · t 统计量</text>
  <text x="867" y="466" class="small" text-anchor="middle">确定性 Bootstrap 置信区间</text>
  <rect x="724" y="518" width="286" height="118" rx="18" fill="#FFFFFF" stroke="#D7DDE8" filter="url(#shadow)" />
  <text x="867" y="554" class="cardTitle" text-anchor="middle">多日组合报告</text>
  <text x="867" y="587" class="body" text-anchor="middle">收益 · 基准 · 主动收益 · 换手</text>
  <text x="867" y="614" class="small" text-anchor="middle">容量 · 标的暴露归因</text>
  <rect x="1074" y="244" width="310" height="336" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="1074" y="244" width="8" height="336" rx="4" fill="#1688D4" />
  <text x="1102" y="279" class="kicker" text-anchor="start" fill="#1688D4">研究产品与开放接口</text>
  <text x="1102" y="316" class="cardTitle" text-anchor="start">筛选 → 观察 → 报告</text>
  <text x="1102" y="352" class="body" text-anchor="start">结构化研究筛选</text>
  <text x="1102" y="382" class="body" text-anchor="start">SQLite 持久观察池</text>
  <text x="1102" y="412" class="body" text-anchor="start">内容寻址不可变报告中心</text>
  <text x="1102" y="442" class="body" text-anchor="start">REST / SDK / CLI / Web</text>
  <text x="1102" y="472" class="body" text-anchor="start">Docker 持久卷与恢复</text>
  <text x="1102" y="502" class="body" text-anchor="start">不部署：链邻桌面软件</text>
