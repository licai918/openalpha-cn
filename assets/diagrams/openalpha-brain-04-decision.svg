  <text x="66" y="206" class="kicker" text-anchor="start" fill="#E89422">结构化信号</text><rect x="52" y="232" width="260" height="100" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="52" y="232" width="8" height="100" rx="4" fill="#7C5CE7"/><rect x="76" y="254" width="54" height="34" rx="17" fill="#7C5CE7" stroke="#7C5CE7" /><text x="103" y="277" class="pill" text-anchor="middle" fill="#FFFFFF">S1</text><text x="146" y="277" class="cardTitle" text-anchor="start">市场事件</text><text x="80" y="316" class="body" text-anchor="start">bullish / bearish</text><rect x="52" y="360" width="260" height="100" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="52" y="360" width="8" height="100" rx="4" fill="#7C5CE7"/><rect x="76" y="382" width="54" height="34" rx="17" fill="#7C5CE7" stroke="#7C5CE7" /><text x="103" y="405" class="pill" text-anchor="middle" fill="#FFFFFF">S2</text><text x="146" y="405" class="cardTitle" text-anchor="start">题材催化</text><text x="80" y="444" class="body" text-anchor="start">confidence / horizon</text><rect x="52" y="488" width="260" height="100" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="52" y="488" width="8" height="100" rx="4" fill="#7C5CE7"/><rect x="76" y="510" width="54" height="34" rx="17" fill="#7C5CE7" stroke="#7C5CE7" /><text x="103" y="533" class="pill" text-anchor="middle" fill="#FFFFFF">S3</text><text x="146" y="533" class="cardTitle" text-anchor="start">资金观察</text><text x="80" y="572" class="body" text-anchor="start">risk_flags</text><rect x="384" y="284" width="244" height="238" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="384" y="284" width="8" height="238" rx="4" fill="#E89422"/><text x="412" y="319" class="kicker" text-anchor="start" fill="#E89422">风险门</text><text x="412" y="356" class="cardTitle" text-anchor="start">RiskGate</text><text x="412" y="392" class="body" text-anchor="start">pass · 正常通过</text><text x="412" y="422" class="body" text-anchor="start">reduce · 降级观察</text><text x="412" y="452" class="body" text-anchor="start">block · 阻断结论</text><text x="412" y="482" class="body" text-anchor="start">风险信号不会被隐藏</text><text x="700" y="206" class="kicker" text-anchor="start" fill="#E89422">A 股约束校验</text><rect x="686" y="232" width="210" height="78" rx="16" fill="#FFF8E9" stroke="#F1D49D" /><text x="708" y="262" class="cardTitle" text-anchor="start">T+1</text><text x="708" y="289" class="small" text-anchor="start">当日买入不可卖</text><rect x="916" y="232" width="210" height="78" rx="16" fill="#FFF8E9" stroke="#F1D49D" /><text x="938" y="262" class="cardTitle" text-anchor="start">整手</text><text x="938" y="289" class="small" text-anchor="start">主板 100 股</text><rect x="686" y="332" width="210" height="78" rx="16" fill="#FFF8E9" stroke="#F1D49D" /><text x="708" y="362" class="cardTitle" text-anchor="start">停牌</text><text x="708" y="389" class="small" text-anchor="start">显式拒绝</text><rect x="916" y="332" width="210" height="78" rx="16" fill="#FFF8E9" stroke="#F1D49D" /><text x="938" y="362" class="cardTitle" text-anchor="start">涨跌停</text><text x="938" y="389" class="small" text-anchor="start">一字板锁单</text><rect x="686" y="432" width="210" height="78" rx="16" fill="#FFF8E9" stroke="#F1D49D" /><text x="708" y="462" class="cardTitle" text-anchor="start">成本</text><text x="708" y="489" class="small" text-anchor="start">佣金 / 过户 / 印花税</text><rect x="1142" y="232" width="246" height="334" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="1142" y="232" width="8" height="334" rx="4" fill="#E89422"/><text x="1170" y="267" class="kicker" text-anchor="start" fill="#E89422">不可变决策记录</text><text x="1170" y="304" class="cardTitle" text-anchor="start">DecisionLedger</text><text x="1170" y="340" class="body" text-anchor="start">watch · 继续观察</text><text x="1170" y="370" class="body" text-anchor="start">avoid · 明确回避</text><text x="1170" y="400" class="body" text-anchor="start">abstain · 证据不足</text><text x="1170" y="430" class="body" text-anchor="start">agent_outputs</text><text x="1170" y="460" class="body" text-anchor="start">routing_path</text><text x="1170" y="490" class="body" text-anchor="start">evidence_ids / signal_ids</text><rect x="688" y="548" width="438" height="104" rx="20" fill="#FFF4E2" stroke="#F0C77C" /><text x="907" y="584" class="cardTitle" text-anchor="middle">研究决策 ≠ 实盘订单</text><text x="907" y="615" class="body" text-anchor="middle">系统记录观察、回避或弃权，不连接券商下单</text><path d="M 312 282 C 346 282, 346 402, 374 402" fill="none" stroke="#E89422" stroke-width="3" marker-end="url(#arrow)"/><path d="M 312 410 C 346 410, 346 402, 374 402" fill="none" stroke="#E89422" stroke-width="3" marker-end="url(#arrow)"/><path d="M 312 538 C 346 538, 346 402, 374 402" fill="none" stroke="#E89422" stroke-width="3" marker-end="url(#arrow)"/><path d="M 628 402 L 676 402" fill="none" stroke="#E89422" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1126 402 L 1132 402" fill="none" stroke="#E89422" stroke-width="3" marker-end="url(#arrow)"/><rect x="1222" y="688" width="154" height="34" rx="17" fill="#E89422" stroke="#E89422" /><text x="1299" y="711" class="pill" text-anchor="middle" fill="#FFFFFF">→ 验证脑区</text>
