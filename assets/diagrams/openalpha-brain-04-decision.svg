<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">把分歧压缩成可解释结论，把结论约束成可审计状态变化</title>
  <desc id="desc">研究委员会与组合会计均由调用方显式组合；主研究链不会把观点偷偷变成订单，更不会连接实盘券商。</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091727" />
      <stop offset=".48" stop-color="#07111E" />
      <stop offset="1" stop-color="#050C16" />
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1160 40) rotate(135) scale(600 420)">
      <stop offset="0" stop-color="#FBBF24" stop-opacity=".16" />
      <stop offset=".62" stop-color="#FBBF24" stop-opacity=".025" />
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="activeNav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24" stop-opacity=".30" />
      <stop offset="1" stop-color="#FBBF24" stop-opacity=".08" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity=".34" />
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6D87A3" stroke-width=".55" opacity=".12" />
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L11 5.5L0 11Z" fill="context-stroke" />
    </marker>
    <style>
      text { font-family: Geist, "Plus Jakarta Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 760; letter-spacing: 1.8px; }
      .title { font-size: 34px; font-weight: 760; letter-spacing: -.5px; }
      .subtitle { font-size: 16px; font-weight: 480; }
      .micro { font-size: 11px; font-weight: 760; letter-spacing: 1.25px; }
      .cardTitle { font-size: 20px; font-weight: 720; }
      .body { font-size: 14px; font-weight: 490; }
      .small { font-size: 12px; font-weight: 520; }
      .mono { font-size: 12px; font-weight: 680; font-family: Geist Mono, "Noto Sans Mono CJK SC", monospace; }
      .metric { font-size: 28px; font-weight: 780; letter-spacing: -.5px; }
      .nav { font-size: 13px; font-weight: 680; }
      .navNum { font-size: 12px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#07111E" />
  <rect width="1440" height="900" fill="url(#bgGradient)" />
  <rect width="1440" height="900" fill="url(#ambient)" />
  <rect width="1440" height="900" fill="url(#grid)" />
  <rect x="64" y="42" width="42" height="4" rx="2" fill="#FBBF24" filter="url(#softGlow)" />
  <text x="64" y="72" class="eyebrow" fill="#FBBF24">OPENALPHA CN · RESEARCH OS / 04</text>
  <text x="64" y="115" class="title" fill="#F4F7FB">决策约束｜把分歧压缩成可解释结论，把结论约束成可审计状态变化</text>
  <text x="64" y="148" class="subtitle" fill="#96A8BE">研究委员会与组合会计均由调用方显式组合；主研究链不会把观点偷偷变成订单，更不会连接实盘券商。</text>
  <g transform="translate(1210 50)" opacity=".92">
    <circle cx="44" cy="30" r="28" fill="#FBBF24" opacity=".09" />
    <path d="M18 42L40 20L56 32L75 11" fill="none" stroke="#FBBF24" stroke-width="2.2" />
    <circle cx="18" cy="42" r="4" fill="#FBBF24" /><circle cx="40" cy="20" r="4" fill="#FBBF24" />
    <circle cx="56" cy="32" r="4" fill="#FBBF24" /><circle cx="75" cy="11" r="4" fill="#FBBF24" />
  </g>
  <line x1="898" y1="171" x2="938" y2="171" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="948" y="175" class="small" fill="#96A8BE" text-anchor="start" opacity="1">自动执行 / 持久化</text>
  <line x1="1108" y1="171" x2="1148" y2="171" stroke="#FBBF24" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#arrow)" />
  <text x="1158" y="175" class="small" fill="#96A8BE" text-anchor="start" opacity="1">显式组合 / 人工反馈</text>
  <circle cx="76" cy="210" r="14" fill="#A78BFA" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".45" />
  <text x="76" y="214" class="navNum" fill="#A78BFA" text-anchor="middle" opacity="1">A</text>
  <text x="100" y="214" class="micro" fill="#A78BFA" text-anchor="start" opacity="1">研究交接</text>
  <rect x="64" y="232" width="244" height="236" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="65" y="233" width="242" height="234" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
  <rect x="64" y="254" width="3" height="192" rx="1.5" fill="#A78BFA" />
  <text x="88" y="261" class="micro" fill="#A78BFA" text-anchor="start" opacity="1">STRUCTURED SIGNALS</text>
  <text x="88" y="294" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">ResearchRunResult</text>
  <text x="88" y="323" class="body" fill="#96A8BE" text-anchor="start" opacity="1">市场 / 题材 / 资金观点</text>
  <text x="88" y="347" class="body" fill="#96A8BE" text-anchor="start" opacity="1">evidence_ids / risk_flags</text>
  <text x="88" y="371" class="body" fill="#96A8BE" text-anchor="start" opacity="1">置信度 / 周期 / 失效条件</text>
  <text x="88" y="395" class="body" fill="#96A8BE" text-anchor="start" opacity="1">RiskGate 已执行</text>
  <rect x="64" y="490" width="244" height="180" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="65" y="491" width="242" height="178" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
  <rect x="64" y="512" width="3" height="136" rx="1.5" fill="#FB7185" />
  <text x="88" y="519" class="micro" fill="#FB7185" text-anchor="start" opacity="1">NO HIDDEN EXECUTION</text>
  <text x="88" y="552" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">责任边界</text>
  <text x="88" y="581" class="body" fill="#96A8BE" text-anchor="start" opacity="1">不自动下单</text>
  <text x="88" y="605" class="body" fill="#96A8BE" text-anchor="start" opacity="1">不连接券商</text>
  <text x="88" y="629" class="body" fill="#96A8BE" text-anchor="start" opacity="1">研究 ≠ 投资指令</text>
  <text x="88" y="653" class="body" fill="#96A8BE" text-anchor="start" opacity="1">每次组合由调用方发起</text>
  <circle cx="357" cy="210" r="14" fill="#FBBF24" fill-opacity=".16" stroke="#FBBF24" stroke-opacity=".45" />
  <text x="357" y="214" class="navNum" fill="#FBBF24" text-anchor="middle" opacity="1">B</text>
  <text x="381" y="214" class="micro" fill="#FBBF24" text-anchor="start" opacity="1">研究委员会 · 显式 deliberate</text>
  <rect x="346" y="232" width="650" height="250" rx="22" fill="#0C1928" stroke="#FBBF24" stroke-opacity=".28" />
  <text x="671" y="250" class="small" fill="#FBBF24" text-anchor="middle" opacity="1">Bull / Bear 辩论</text>
  <rect x="370" y="260" width="208" height="120" rx="18" fill="#13243A" stroke="#A3E635" stroke-opacity=".34" />
  <text x="394" y="289" class="micro" fill="#A3E635" text-anchor="start" opacity="1">BULL / 正方</text>
  <text x="394" y="322" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">收益证据链</text>
  <text x="394" y="352" class="body" fill="#96A8BE" text-anchor="start" opacity="1">机会 · 催化 · 确认条件</text>
  <rect x="596" y="260" width="208" height="120" rx="18" fill="#13243A" stroke="#FB7185" stroke-opacity=".34" />
  <text x="620" y="289" class="micro" fill="#FB7185" text-anchor="start" opacity="1">BEAR / 反方</text>
  <text x="620" y="322" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">风险证据链</text>
  <text x="620" y="352" class="body" fill="#96A8BE" text-anchor="start" opacity="1">反例 · 失效 · 流动性</text>
  <rect x="822" y="260" width="150" height="120" rx="18" fill="#13243A" stroke="#FBBF24" stroke-opacity=".34" />
  <text x="846" y="289" class="micro" fill="#FBBF24" text-anchor="start" opacity="1">RISK PANEL</text>
  <text x="846" y="320" class="body" fill="#F4F7FB" text-anchor="start" opacity="1">激进 / 中性</text>
  <text x="846" y="347" class="body" fill="#F4F7FB" text-anchor="start" opacity="1">保守 / 弃权</text>
