  <text x="708" y="389" class="small" text-anchor="start">回撤与流动性优先</text>
  <rect x="916" y="332" width="210" height="78" rx="16" fill="#FFF8E9" stroke="#F1D49D" />
  <text x="938" y="362" class="cardTitle" text-anchor="start">T+1 · 整手</text>
  <text x="938" y="389" class="small" text-anchor="start">当日不可卖 · 100 股</text>
  <rect x="686" y="432" width="210" height="78" rx="16" fill="#FFF8E9" stroke="#F1D49D" />
  <text x="708" y="462" class="cardTitle" text-anchor="start">停牌 · 涨跌停</text>
  <text x="708" y="489" class="small" text-anchor="start">显式拒绝 · 锁单</text>
  <rect x="1142" y="232" width="246" height="334" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="1142" y="232" width="8" height="334" rx="4" fill="#E89422" />
  <text x="1170" y="267" class="kicker" text-anchor="start" fill="#E89422">风险门 + 决策账本</text>
  <text x="1170" y="304" class="cardTitle" text-anchor="start">RiskGate / Ledger</text>
  <text x="1170" y="340" class="body" text-anchor="start">pass · reduce · block</text>
  <text x="1170" y="370" class="body" text-anchor="start">watch · avoid · abstain</text>
  <text x="1170" y="400" class="body" text-anchor="start">风险信号不会被隐藏</text>
  <text x="1170" y="430" class="body" text-anchor="start">agent_outputs</text>
  <text x="1170" y="460" class="body" text-anchor="start">routing_path</text>
  <text x="1170" y="490" class="body" text-anchor="start">evidence_ids / signal_ids</text>
  <rect x="688" y="548" width="438" height="104" rx="20" fill="#FFF4E2" stroke="#F0C77C" />
  <text x="907" y="584" class="cardTitle" text-anchor="middle">不可变组合转移账本</text>
  <text x="907" y="615" class="body" text-anchor="middle">订单 → 成交 / 拒单 → 持仓与现金；研究回测使用，不连接券商</text>
