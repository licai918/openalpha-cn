  <rect x="384" y="284" width="8" height="238" rx="4" fill="#E89422" />
  <text x="412" y="319" class="kicker" text-anchor="start" fill="#E89422">可消融研究委员会</text>
  <text x="412" y="356" class="cardTitle" text-anchor="start">Bull / Bear 辩论</text>
  <text x="412" y="392" class="body" text-anchor="start">正方 · 收益证据链</text>
  <text x="412" y="422" class="body" text-anchor="start">反方 · 风险证据链</text>
  <text x="412" y="452" class="body" text-anchor="start">独立启停 · 消融对照</text>
  <text x="412" y="482" class="body" text-anchor="start">输出结构化分歧摘要</text>
  <text x="700" y="206" class="kicker" text-anchor="start" fill="#E89422">三态风险委员会 + A 股约束</text>
  <rect x="686" y="232" width="210" height="78" rx="16" fill="#FFF8E9" stroke="#F1D49D" />
  <text x="708" y="262" class="cardTitle" text-anchor="start">激进</text>
