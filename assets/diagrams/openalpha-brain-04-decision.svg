  <text x="671" y="435" class="small" fill="#FBBF24" text-anchor="middle" opacity="1">DeliberationOutcome · 分歧摘要 / 风险调整信号 / 消融对照</text>
  <circle cx="1045" cy="210" r="14" fill="#FB7185" fill-opacity=".16" stroke="#FB7185" stroke-opacity=".45" />
  <text x="1045" y="214" class="navNum" fill="#FB7185" text-anchor="middle" opacity="1">C</text>
  <text x="1069" y="214" class="micro" fill="#FB7185" text-anchor="start" opacity="1">最终研究裁决</text>
  <rect x="1034" y="232" width="342" height="250" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="1035" y="233" width="340" height="248" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
  <rect x="1034" y="254" width="3" height="206" rx="1.5" fill="#FB7185" />
  <text x="1058" y="261" class="micro" fill="#FB7185" text-anchor="start" opacity="1">POLICY DECISION</text>
  <text x="1058" y="294" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">RiskGate / DecisionLedger</text>
  <text x="1058" y="323" class="body" fill="#96A8BE" text-anchor="start" opacity="1">pass · reduce · block</text>
  <text x="1058" y="347" class="body" fill="#96A8BE" text-anchor="start" opacity="1">watch · avoid · abstain</text>
  <text x="1058" y="371" class="body" fill="#96A8BE" text-anchor="start" opacity="1">风险信号保留，不被模型文案覆盖</text>
  <text x="1058" y="395" class="body" fill="#96A8BE" text-anchor="start" opacity="1">证据 / 路由 / 信号 / 裁决全链可追溯</text>
  <text x="1058" y="419" class="body" fill="#96A8BE" text-anchor="start" opacity="1">显式弃权是合法的一等结果</text>
  <path d="M996 357H1015V340H1034" fill="none" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="8 8" marker-end="url(#arrow)" opacity="1" />
  <circle cx="357" cy="520" r="14" fill="#38BDF8" fill-opacity=".16" stroke="#38BDF8" stroke-opacity=".45" />
  <text x="357" y="524" class="navNum" fill="#38BDF8" text-anchor="middle" opacity="1">D</text>
  <text x="381" y="524" class="micro" fill="#38BDF8" text-anchor="start" opacity="1">组合会计 · 显式 portfolio compose</text>
  <rect x="346" y="542" width="1030" height="128" rx="22" fill="#0C1928" stroke="#38BDF8" stroke-opacity=".30" />
  <text x="370" y="574" class="micro" fill="#A78BFA" text-anchor="start" opacity="1">输入状态</text>
  <text x="370" y="603" class="body" fill="#F4F7FB" text-anchor="start" opacity="1">PortfolioState</text>
  <text x="370" y="631" class="body" fill="#96A8BE" text-anchor="start" opacity="1">Order / MarketBar / Limits</text>
  <path d="M630 606L664 606" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-dasharray="8 8" marker-end="url(#arrow)" />
  <text x="650" y="574" class="micro" fill="#FBBF24" text-anchor="start" opacity="1">A 股约束</text>
  <text x="650" y="603" class="body" fill="#F4F7FB" text-anchor="start" opacity="1">T+1 · 100 股整手</text>
  <text x="650" y="631" class="body" fill="#96A8BE" text-anchor="start" opacity="1">停牌 · 涨跌停 · 费用</text>
  <path d="M960 606L994 606" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-dasharray="8 8" marker-end="url(#arrow)" />
  <text x="980" y="574" class="micro" fill="#38BDF8" text-anchor="start" opacity="1">PortfolioTransition</text>
  <text x="980" y="603" class="body" fill="#F4F7FB" text-anchor="start" opacity="1">订单 → 成交 / 拒单</text>
  <text x="980" y="631" class="body" fill="#96A8BE" text-anchor="start" opacity="1">持仓 / 现金 / FIFO / 暴露</text>
  <text x="1352" y="650" class="small" fill="#38BDF8" text-anchor="end" opacity="1">不可变组合转移账本</text>
  <text x="64" y="785" class="micro" fill="#96A8BE" text-anchor="start" opacity="1">研究闭环导航</text>
  <text x="200" y="785" class="small" fill="#6F829A" text-anchor="start" opacity="1">每一脑区交付一个可验证产物，最终回到下一轮证据与规则</text>
