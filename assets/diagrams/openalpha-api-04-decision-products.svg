<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">决策产品链｜研究结果如何转化为可复用资产</title>
  <desc id="desc">ResearchRunResult 是公共交汇点；委员会、筛选、报告、观察池和组合 API 由调用方按业务目的显式组合。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#27324A" flood-opacity=".10" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" />
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D8DEEB" />
    </pattern>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 760; fill: #0F172A; letter-spacing: -.4px; }
      .subtitle { font-size: 18px; font-weight: 450; fill: #64748B; }
      .section { font-size: 14px; font-weight: 800; letter-spacing: 1.1px; }
      .cardTitle { font-size: 21px; font-weight: 760; fill: #0F172A; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 520; fill: #64748B; }
      .endpoint { font-size: 14px; font-weight: 720; fill: #26324A; }
      .pill { font-size: 14px; font-weight: 780; letter-spacing: .35px; }
      .arrowLabel { font-size: 13px; font-weight: 700; fill: #64748B; }
      .navCaption { font-size: 15px; font-weight: 650; fill: #64748B; letter-spacing: .4px; }
      .navNumber { font-size: 15px; font-weight: 800; }
      .navLabel { font-size: 17px; font-weight: 720; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F7F8FC" />
  <rect width="1440" height="900" fill="url(#dots)" opacity=".36" />
  <rect x="64" y="42" width="188" height="34" rx="17" fill="#5968F2" />
  <text x="158" y="65" class="pill" text-anchor="middle" fill="#FFFFFF">OPENALPHA · API 04</text>
  <text x="64" y="112" class="title">决策产品链｜研究结果如何转化为可复用资产</text>
  <text x="64" y="148" class="subtitle">ResearchRunResult 是公共交汇点；委员会、筛选、报告、观察池和组合 API 由调用方按业务目的显式组合。</text>
  <rect x="64" y="290" width="274" height="212" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="64" y="290" width="7" height="212" rx="3.5" fill="#7C5CE7" />
  <text x="88" y="322" class="cardTitle">可信研究结果</text>
  <text x="88" y="350" class="body">SignalFrame</text>
  <text x="88" y="375" class="body">DecisionLedger</text>
  <text x="88" y="400" class="body">RunManifest</text>
  <text x="88" y="425" class="body">AgentResult[]</text>
  <text x="88" y="450" class="body">内容派生 ID 可复核</text>
  <rect x="392" y="190" width="302" height="180" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="392" y="190" width="7" height="180" rx="3.5" fill="#E89422" />
  <text x="416" y="222" class="cardTitle">双委员会</text>
  <rect x="414" y="232" width="260" height="27" rx="9" fill="#E89422" opacity=".10" />
  <text x="424" y="251" class="endpoint">POST /api/v1/research/deliberate</text>
  <text x="416" y="286" class="body">Bull / Bear 证据案例</text>
  <text x="416" y="311" class="body">激进 / 中性 / 保守票决</text>
  <text x="416" y="336" class="body">adjusted_signal + ablation</text>
  <rect x="392" y="420" width="302" height="180" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="392" y="420" width="7" height="180" rx="3.5" fill="#1688D4" />
  <text x="416" y="452" class="cardTitle">结构化筛选</text>
  <rect x="414" y="462" width="260" height="27" rx="9" fill="#1688D4" opacity=".10" />
  <text x="424" y="481" class="endpoint">POST /api/v1/screen</text>
  <text x="416" y="516" class="body">先重建并核验研究结果</text>
  <text x="416" y="541" class="body">显式 ScreeningCriteria</text>
  <text x="416" y="566" class="body">返回排序与排除原因</text>
  <path d="M 340 370 C 366 370, 360 280, 384 280" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <path d="M 340 422 C 366 422, 360 510, 384 510" fill="none" stroke="#1688D4" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <rect x="748" y="190" width="286" height="180" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="748" y="190" width="7" height="180" rx="3.5" fill="#0F9F8F" />
  <text x="772" y="222" class="cardTitle">不可变报告</text>
  <rect x="770" y="232" width="244" height="27" rx="9" fill="#0F9F8F" opacity=".10" />
  <text x="780" y="251" class="endpoint">POST /api/v1/reports</text>
  <text x="772" y="286" class="body">完整性校验</text>
  <text x="772" y="311" class="body">证据 ID 关联</text>
  <text x="772" y="336" class="body">content-derived report_id</text>
  <rect x="748" y="420" width="286" height="180" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="748" y="420" width="7" height="180" rx="3.5" fill="#0F9F8F" />
  <text x="772" y="452" class="cardTitle">持久观察池</text>
  <rect x="770" y="462" width="244" height="27" rx="9" fill="#0F9F8F" opacity=".10" />
  <text x="780" y="481" class="endpoint">POST /api/v1/watchlist</text>
  <text x="772" y="516" class="body">调用方选择入池标的</text>
  <text x="772" y="541" class="body">GET 列表 / remove</text>
  <text x="772" y="566" class="body">SQLite 本地持久化</text>
  <path d="M 340 320 C 360 180, 650 170, 720 170 L 720 280 L 740 280" fill="none" stroke="#0F9F8F" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <path d="M 696 510 L 740 510" fill="none" stroke="#0F9F8F" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <text x="718" y="492" class="arrowLabel" text-anchor="middle">显式选择入池</text>
  <rect x="1088" y="190" width="276" height="180" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="1088" y="190" width="7" height="180" rx="3.5" fill="#D95D67" />
  <text x="1112" y="222" class="cardTitle">组合执行输入</text>
  <text x="1112" y="250" class="body">PortfolioState</text>
  <text x="1112" y="275" class="body">PortfolioOrder</text>
  <text x="1112" y="300" class="body">MarketBar + Limits</text>
  <text x="1112" y="325" class="body">研究结果不会自动下单</text>
  <rect x="1088" y="420" width="276" height="180" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="1088" y="420" width="7" height="180" rx="3.5" fill="#D95D67" />
  <text x="1112" y="452" class="cardTitle">A 股组合转移</text>
  <rect x="1110" y="462" width="234" height="27" rx="9" fill="#D95D67" opacity=".10" />
  <text x="1120" y="481" class="endpoint">POST /api/v1/portfolio/execute</text>
  <text x="1112" y="516" class="body">T+1 / 整手 / 停牌 / 涨跌停</text>
  <text x="1112" y="541" class="body">费用 / FIFO / 敞口限制</text>
  <text x="1112" y="566" class="body">不可变 PortfolioTransition</text>
  <path d="M 340 300 C 350 156, 1048 156, 1080 260" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <text x="804" y="172" class="arrowLabel" text-anchor="middle">调用方基于研究结果构造订单</text>
  <path d="M 1226 372 L 1226 412" fill="none" stroke="#D95D67" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="392" y="642" width="972" height="66" rx="18" fill="#F2F4F8" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="392" y="642" width="7" height="66" rx="3.5" fill="#64748B" />
  <text x="416" y="674" class="cardTitle">持久研究资产</text>
  <text x="416" y="702" class="body">GET /reports · GET /watchlist · GET /portfolio/ledger · GET /memory/{subject}</text>
  <path d="M 890 602 L 890 634" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 1226 602 L 1226 634" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 72 746 L 126 746" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)" />
  <text x="140" y="751" class="small">服务端自动调用 / 持久化</text>
  <path d="M 380 746 L 434 746" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <text x="448" y="751" class="small">调用方显式组合 / 反馈</text>
  <rect x="746" y="731" width="16" height="16" rx="4" fill="#64748B" opacity=".16" stroke="#64748B" />
  <text x="774" y="751" class="small">SQLite / Parquet 持久状态</text>
  <text x="1060" y="751" class="small">边界：不连接实盘券商</text>
  <text x="64" y="780" class="navCaption">API 关系导航｜从数据合同到验证反馈的五层公开能力</text>
  <rect x="64" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="98" y="838" class="navNumber" text-anchor="middle" fill="#64748B">01</text>
  <text x="134" y="837" class="navLabel" fill="#0F172A">API 全景</text>
  <path d="M 286 831 L 316 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="328" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="362" y="838" class="navNumber" text-anchor="middle" fill="#64748B">02</text>
  <text x="398" y="837" class="navLabel" fill="#0F172A">证据数据</text>
  <path d="M 550 831 L 580 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="592" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="626" y="838" class="navNumber" text-anchor="middle" fill="#64748B">03</text>
  <text x="662" y="837" class="navLabel" fill="#0F172A">研究编排</text>
  <path d="M 814 831 L 844 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="856" y="802" width="216" height="58" rx="18" fill="#5968F2" stroke="#5968F2" filter="url(#shadow)" />
  <text x="890" y="838" class="navNumber" text-anchor="middle" fill="#FFFFFF">04</text>
  <text x="926" y="837" class="navLabel" fill="#FFFFFF">决策产品</text>
  <path d="M 1078 831 L 1108 831" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1120" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="1154" y="838" class="navNumber" text-anchor="middle" fill="#64748B">05</text>
  <text x="1190" y="837" class="navLabel" fill="#0F172A">验证闭环</text>
</svg>
