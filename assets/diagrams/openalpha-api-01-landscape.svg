<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">API 全景｜四类入口共享五条功能链</title>
  <desc id="desc">REST、SDK、CLI 与 React 工作台通过同一 FastAPI 合同进入证据、研究、产品、组合与验证能力。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#27324A" flood-opacity=".10" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" />
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D8DEEB" />
    </pattern>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 760; fill: #0F172A; letter-spacing: -.4px; }
      .subtitle { font-size: 18px; font-weight: 450; fill: #64748B; }
      .section { font-size: 14px; font-weight: 800; letter-spacing: 1.1px; }
      .cardTitle { font-size: 21px; font-weight: 760; fill: #0F172A; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 520; fill: #64748B; }
      .endpoint { font-size: 14px; font-weight: 720; fill: #26324A; }
      .pill { font-size: 14px; font-weight: 780; letter-spacing: .35px; }
      .arrowLabel { font-size: 13px; font-weight: 700; fill: #64748B; }
      .navCaption { font-size: 15px; font-weight: 650; fill: #64748B; letter-spacing: .4px; }
      .navNumber { font-size: 15px; font-weight: 800; }
      .navLabel { font-size: 17px; font-weight: 720; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F7F8FC" />
  <rect width="1440" height="900" fill="url(#dots)" opacity=".36" />
  <rect x="64" y="42" width="188" height="34" rx="17" fill="#5968F2" />
  <text x="158" y="65" class="pill" text-anchor="middle" fill="#FFFFFF">OPENALPHA · API 01</text>
  <text x="64" y="112" class="title">API 全景｜四类入口共享五条功能链</text>
  <text x="64" y="148" class="subtitle">REST、SDK、CLI 与 React 工作台通过同一 FastAPI 合同进入证据、研究、产品、组合与验证能力。</text>
  <text x="64" y="194" class="section" fill="#64748B">调用入口</text>
  <rect x="64" y="220" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#5968F2" />
  <text x="162" y="244" class="pill" text-anchor="middle" fill="#5968F2">REST / OpenAPI</text>
  <rect x="64" y="284" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#5968F2" />
  <text x="162" y="308" class="pill" text-anchor="middle" fill="#5968F2">Python SDK</text>
  <rect x="64" y="348" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#5968F2" />
  <text x="162" y="372" class="pill" text-anchor="middle" fill="#5968F2">Typer CLI</text>
  <rect x="64" y="412" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#5968F2" />
  <text x="162" y="436" class="pill" text-anchor="middle" fill="#5968F2">React 工作台</text>
  <rect x="302" y="220" width="250" height="330" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="302" y="220" width="7" height="330" rx="3.5" fill="#5968F2" />
  <text x="326" y="252" class="cardTitle">FastAPI 公共边界</text>
  <rect x="324" y="262" width="208" height="27" rx="9" fill="#5968F2" opacity=".10" />
  <text x="334" y="281" class="endpoint">GET /health · /docs · /openapi.json</text>
  <text x="326" y="316" class="body">Pydantic 严格 Schema</text>
  <text x="326" y="341" class="body">32 MiB 默认请求上限</text>
  <text x="326" y="366" class="body">安全响应头</text>
  <text x="326" y="391" class="body">本机 CORS 白名单</text>
  <text x="326" y="416" class="body">HTTP 只接结构化记录</text>
  <text x="326" y="441" class="body">版本前缀 /api/v1</text>
  <path d="M 262 350 L 294 350" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)" />
  <text x="606" y="194" class="section" fill="#64748B">五条公开功能链</text>
  <rect x="628" y="210" width="674" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="628" y="210" width="7" height="78" rx="3.5" fill="#0F9F8F" />
  <text x="652" y="241" class="cardTitle">证据链</text>
  <text x="836" y="239" class="endpoint">POST /api/v1/evidence/build</text>
  <text x="836" y="266" class="body">PIT 快照 → Parquet → 查询</text>
  <path d="M 554 385 C 590 385, 584 249, 620 249" fill="none" stroke="#0F9F8F" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="628" y="302" width="674" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="628" y="302" width="7" height="78" rx="3.5" fill="#7C5CE7" />
  <text x="652" y="333" class="cardTitle">研究链</text>
  <text x="836" y="331" class="endpoint">POST /api/v1/research/run</text>
  <text x="836" y="358" class="body">路由 → Agent → Signal → 风险门</text>
  <path d="M 554 385 C 590 385, 584 341, 620 341" fill="none" stroke="#7C5CE7" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="628" y="394" width="674" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="628" y="394" width="7" height="78" rx="3.5" fill="#E89422" />
  <text x="652" y="425" class="cardTitle">研究产品链</text>
  <text x="836" y="423" class="endpoint">POST /api/v1/screen · /reports</text>
  <text x="836" y="450" class="body">筛选 → 观察池 → 不可变报告</text>
  <path d="M 554 385 C 590 385, 584 433, 620 433" fill="none" stroke="#E89422" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="628" y="486" width="674" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="628" y="486" width="7" height="78" rx="3.5" fill="#D95D67" />
  <text x="652" y="517" class="cardTitle">组合链</text>
  <text x="836" y="515" class="endpoint">POST /api/v1/portfolio/execute</text>
  <text x="836" y="542" class="body">A 股约束 → 转移 → 不可变账本</text>
  <path d="M 554 385 C 590 385, 584 525, 620 525" fill="none" stroke="#D95D67" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="628" y="578" width="674" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="628" y="578" width="7" height="78" rx="3.5" fill="#1688D4" />
  <text x="652" y="609" class="cardTitle">验证链</text>
  <text x="836" y="607" class="endpoint">POST /api/v1/backtests/replay</text>
  <text x="836" y="634" class="body">同路径回放 → 统计 → 归因</text>
  <path d="M 554 385 C 590 385, 584 617, 620 617" fill="none" stroke="#1688D4" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1040" y="650" width="262" height="70" rx="18" fill="#F2F4F8" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="1040" y="650" width="7" height="70" rx="3.5" fill="#64748B" />
  <text x="1064" y="682" class="cardTitle">持久状态</text>
  <text x="1064" y="710" class="body">Parquet + SQLite WAL</text>
  <path d="M 960 656 C 960 700, 1000 685, 1032 685" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)" />
  <text x="930" y="704" class="arrowLabel" text-anchor="middle">证据 / 运行 / 账本</text>
  <path d="M 72 732 L 126 732" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)" />
  <text x="140" y="737" class="small">服务端自动调用 / 持久化</text>
  <path d="M 380 732 L 434 732" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <text x="448" y="737" class="small">调用方显式组合 / 反馈</text>
  <rect x="746" y="717" width="16" height="16" rx="4" fill="#64748B" opacity=".16" stroke="#64748B" />
  <text x="774" y="737" class="small">SQLite / Parquet 持久状态</text>
  <text x="1060" y="737" class="small">边界：不连接实盘券商</text>
  <text x="64" y="780" class="navCaption">API 关系导航｜从数据合同到验证反馈的五层公开能力</text>
  <rect x="64" y="802" width="216" height="58" rx="18" fill="#5968F2" stroke="#5968F2" filter="url(#shadow)" />
  <text x="98" y="838" class="navNumber" text-anchor="middle" fill="#FFFFFF">01</text>
  <text x="134" y="837" class="navLabel" fill="#FFFFFF">API 全景</text>
  <path d="M 286 831 L 316 831" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="328" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="362" y="838" class="navNumber" text-anchor="middle" fill="#64748B">02</text>
  <text x="398" y="837" class="navLabel" fill="#0F172A">证据数据</text>
  <path d="M 550 831 L 580 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="592" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="626" y="838" class="navNumber" text-anchor="middle" fill="#64748B">03</text>
  <text x="662" y="837" class="navLabel" fill="#0F172A">研究编排</text>
  <path d="M 814 831 L 844 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="856" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="890" y="838" class="navNumber" text-anchor="middle" fill="#64748B">04</text>
  <text x="926" y="837" class="navLabel" fill="#0F172A">决策产品</text>
  <path d="M 1078 831 L 1108 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1120" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="1154" y="838" class="navNumber" text-anchor="middle" fill="#64748B">05</text>
  <text x="1190" y="837" class="navLabel" fill="#0F172A">验证闭环</text>
</svg>
