  <rect width="1440" height="900" fill="#F7F8FC" />
  <rect width="1440" height="900" fill="url(#dots)" opacity=".36" />
  <rect x="64" y="42" width="188" height="34" rx="17" fill="#5968F2" />
  <text x="158" y="65" class="pill" text-anchor="middle" fill="#FFFFFF">OPENALPHA · API 01</text>
  <text x="64" y="112" class="title">API 全景｜四类入口与五条 v1 研究功能链</text>
  <text x="64" y="148" class="subtitle">REST 调用方经同一 FastAPI 边界进入，SDK 与 CLI 在进程内调用同一批服务；面板、因子、候选榜、模型与调度五个 v2 平面的路由未画入，它们同样在 /api/v1 下。</text>
  <text x="64" y="194" class="section" fill="#64748B">调用入口</text>
  <rect x="64" y="220" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#5968F2" />
  <text x="162" y="244" class="pill" text-anchor="middle" fill="#5968F2">REST / OpenAPI</text>
  <path d="M 262 238 L 294 238" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow-5968F2)" />
  <rect x="64" y="284" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#5968F2" />
  <text x="162" y="308" class="pill" text-anchor="middle" fill="#5968F2">React 工作台</text>
  <path d="M 262 302 L 294 302" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow-5968F2)" />
  <rect x="64" y="500" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#5968F2" />
  <text x="162" y="524" class="pill" text-anchor="middle" fill="#5968F2">Python SDK</text>
  <path d="M 262 518 L 630 518" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-E89422)" />
  <rect x="64" y="564" width="196" height="36" rx="18" fill="#FFFFFF" stroke="#5968F2" />
  <text x="162" y="588" class="pill" text-anchor="middle" fill="#5968F2">Typer CLI</text>
  <path d="M 262 582 L 630 582" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-E89422)" />
  <text x="446" y="555" class="arrowLabel" text-anchor="middle">进程内调用，不经 FastAPI</text>
  <rect x="302" y="220" width="292" height="250" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="302" y="220" width="7" height="250" rx="3.5" fill="#5968F2" />
  <text x="326" y="252" class="cardTitle">FastAPI 公共边界</text>
  <rect x="324" y="262" width="250" height="27" rx="9" fill="#5968F2" opacity=".10" />
  <text x="334" y="281" class="endpoint">GET /health · /docs · /openapi.json</text>
  <text x="326" y="316" class="body">Pydantic 严格 Schema</text>
  <text x="326" y="341" class="body">32 MiB 默认请求上限</text>
  <text x="326" y="366" class="body">安全响应头</text>
  <text x="326" y="391" class="body">本机 CORS 白名单</text>
  <text x="326" y="416" class="body">HTTP 只接结构化记录</text>
  <text x="326" y="441" class="body">版本前缀 /api/v1</text>
  <path d="M 598 345 L 630 345" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow-5968F2)" />
  <text x="622" y="194" class="section" fill="#64748B">服务层</text>
  <rect x="638" y="210" width="12" height="430" rx="6" fill="#64748B" opacity=".28" />
  <text x="700" y="194" class="section" fill="#64748B">五条公开功能链</text>
  <rect x="700" y="210" width="602" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="700" y="210" width="7" height="78" rx="3.5" fill="#0F9F8F" />
  <text x="724" y="241" class="cardTitle">证据链</text>
  <text x="908" y="239" class="endpoint">POST /api/v1/evidence/build</text>
  <text x="908" y="266" class="body">PIT 快照 → Parquet → 查询</text>
  <path d="M 654 249 L 692 249" fill="none" stroke="#0F9F8F" stroke-width="3" marker-end="url(#arrow-0F9F8F)" />
  <rect x="700" y="298" width="602" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="700" y="298" width="7" height="78" rx="3.5" fill="#7C5CE7" />
  <text x="724" y="329" class="cardTitle">研究链</text>
  <text x="908" y="327" class="endpoint">POST /api/v1/research/run</text>
  <text x="908" y="354" class="body">路由 → Agent → Signal → 风险门</text>
  <path d="M 654 337 L 692 337" fill="none" stroke="#7C5CE7" stroke-width="3" marker-end="url(#arrow-7C5CE7)" />
  <rect x="700" y="386" width="602" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="700" y="386" width="7" height="78" rx="3.5" fill="#E89422" />
  <text x="724" y="417" class="cardTitle">研究产品链</text>
  <text x="908" y="415" class="endpoint">POST /api/v1/screen · /reports</text>
  <text x="908" y="442" class="body">筛选 · 观察池 · 不可变报告</text>
  <path d="M 654 425 L 692 425" fill="none" stroke="#E89422" stroke-width="3" marker-end="url(#arrow-E89422)" />
  <rect x="700" y="474" width="602" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="700" y="474" width="7" height="78" rx="3.5" fill="#D95D67" />
  <text x="724" y="505" class="cardTitle">组合链</text>
  <text x="908" y="503" class="endpoint">POST /api/v1/portfolio/execute</text>
  <text x="908" y="530" class="body">A 股约束 → 转移 → 不可变账本</text>
  <path d="M 654 513 L 692 513" fill="none" stroke="#D95D67" stroke-width="3" marker-end="url(#arrow-D95D67)" />
  <rect x="700" y="562" width="602" height="78" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="700" y="562" width="7" height="78" rx="3.5" fill="#1688D4" />
  <text x="724" y="593" class="cardTitle">验证链</text>
  <text x="908" y="591" class="endpoint">POST /api/v1/backtests/replay</text>
  <text x="908" y="618" class="body">同路径回放 → 统计 → 归因</text>
  <path d="M 654 601 L 692 601" fill="none" stroke="#1688D4" stroke-width="3" marker-end="url(#arrow-1688D4)" />
  <rect x="1040" y="650" width="262" height="70" rx="18" fill="#F2F4F8" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="1040" y="650" width="7" height="70" rx="3.5" fill="#64748B" />
  <text x="1064" y="682" class="cardTitle">持久状态</text>
  <text x="1064" y="710" class="body">Parquet + SQLite WAL</text>
  <path d="M 960 640 C 960 684, 1000 685, 1032 685" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow-64748B)" />
  <text x="930" y="704" class="arrowLabel" text-anchor="middle">证据 / 运行 / 账本</text>
  <path d="M 72 732 L 126 732" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow-5968F2)" />
  <text x="140" y="737" class="small">服务端自动调用 / 持久化</text>
  <path d="M 380 732 L 434 732" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-E89422)" />
  <text x="448" y="737" class="small">调用方显式组合 / 反馈</text>
  <rect x="746" y="717" width="16" height="16" rx="4" fill="#64748B" opacity=".16" stroke="#64748B" />
  <text x="774" y="737" class="small">SQLite / Parquet 持久状态</text>
  <text x="1060" y="737" class="small">边界：不连接实盘券商</text>
  <text x="64" y="780" class="navCaption">API 关系导航｜从数据合同到验证反馈的五条 v1 研究链</text>
  <rect x="64" y="802" width="216" height="58" rx="18" fill="#5968F2" stroke="#5968F2" filter="url(#shadow)" />
  <text x="98" y="838" class="navNumber" text-anchor="middle" fill="#FFFFFF">01</text>
  <text x="134" y="837" class="navLabel" fill="#FFFFFF">API 全景</text>
  <path d="M 286 831 L 316 831" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow-5968F2)" />
  <rect x="328" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="362" y="838" class="navNumber" text-anchor="middle" fill="#64748B">02</text>
  <text x="398" y="837" class="navLabel" fill="#0F172A">证据数据</text>
  <path d="M 550 831 L 580 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow-C5CDDA)" />
  <rect x="592" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="626" y="838" class="navNumber" text-anchor="middle" fill="#64748B">03</text>
  <text x="662" y="837" class="navLabel" fill="#0F172A">研究编排</text>
  <path d="M 814 831 L 844 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow-C5CDDA)" />
  <rect x="856" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="890" y="838" class="navNumber" text-anchor="middle" fill="#64748B">04</text>
  <text x="926" y="837" class="navLabel" fill="#0F172A">决策产品</text>
  <path d="M 1078 831 L 1108 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow-C5CDDA)" />
  <rect x="1120" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="1154" y="838" class="navNumber" text-anchor="middle" fill="#64748B">05</text>
  <text x="1190" y="837" class="navLabel" fill="#0F172A">验证闭环</text>
</svg>
