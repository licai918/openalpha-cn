<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">全脑总览｜五个脑区组成一条 A 股研究闭环</title>
  <desc id="desc">吸收多角色协作与风险决策的表达优势，用证据、时间与回放把整条链路变得可验证。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#27324A" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D8DEEB"/>
    </pattern>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 760; fill: #0F172A; letter-spacing: -.5px; }
      .subtitle { font-size: 19px; font-weight: 450; fill: #64748B; }
      .cardTitle { font-size: 23px; font-weight: 720; fill: #0F172A; }
      .kicker { font-size: 14px; font-weight: 760; letter-spacing: 1.2px; }
      .body { font-size: 17px; font-weight: 470; fill: #334155; }
      .small { font-size: 15px; font-weight: 500; fill: #64748B; }
      .pill { font-size: 14px; font-weight: 760; letter-spacing: .4px; }
      .metric { font-size: 28px; font-weight: 780; fill: #0F172A; }
      .navCaption { font-size: 15px; font-weight: 650; fill: #64748B; letter-spacing: .4px; }
      .navNumber { font-size: 15px; font-weight: 800; }
      .navLabel { font-size: 17px; font-weight: 720; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F7F8FC"/>
  <rect width="1440" height="900" fill="url(#dots)" opacity=".36"/>
  <rect x="64" y="46" width="158" height="34" rx="17" fill="#5968F2" stroke="#5968F2" /><text x="143" y="69" class="pill" text-anchor="middle" fill="#FFFFFF">OPENALPHA · 01</text><text x="64" y="116" class="title" text-anchor="start">全脑总览｜五个脑区组成一条 A 股研究闭环</text><text x="64" y="154" class="subtitle" text-anchor="start">吸收多角色协作与风险决策的表达优势，用证据、时间与回放把整条链路变得可验证。</text><g transform="translate(1270 42)">
      <path d="M48 10c-19 0-34 14-34 32 0 9 4 17 10 23-2 4-3 9-2 14 2 12 13 21 26 21h29c15 0 27-11 27-25 0-7-3-13-8-18 2-5 2-11 0-17-4-12-16-20-29-19-5-7-11-11-19-11Z" fill="#5968F2" opacity=".12"/>
      <circle cx="42" cy="44" r="7" fill="#5968F2"/>
      <circle cx="70" cy="33" r="7" fill="#5968F2" opacity=".8"/>
      <circle cx="82" cy="65" r="7" fill="#5968F2" opacity=".65"/>
      <path d="M48 43 64 35M47 49 76 62M72 39 80 58" stroke="#5968F2" stroke-width="3" stroke-linecap="round"/>
    </g>
  <text x="720" y="206" class="metric" text-anchor="middle">OPENALPHA CN · A 股研究大脑</text><text x="720" y="238" class="small" text-anchor="middle">感知 → 证据 → 研判 → 决策 → 验证，再把结果反馈给下一轮研究</text><rect x="52" y="282" width="240" height="278" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="52" y="282" width="8" height="278" rx="4" fill="#0F9F8F"/><rect x="76" y="304" width="54" height="34" rx="17" fill="#0F9F8F" stroke="#0F9F8F" /><text x="103" y="327" class="pill" text-anchor="middle" fill="#FFFFFF">01</text><text x="146" y="327" class="cardTitle" text-anchor="start">数据感知</text><text x="80" y="366" class="body" text-anchor="start">自有文件 / Tushare</text><text x="80" y="396" class="body" text-anchor="start">可选 AKShare</text><text x="80" y="426" class="body" text-anchor="start">来源与许可元数据</text><rect x="326" y="282" width="240" height="278" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="326" y="282" width="8" height="278" rx="4" fill="#1AA7A1"/><rect x="350" y="304" width="54" height="34" rx="17" fill="#1AA7A1" stroke="#1AA7A1" /><text x="377" y="327" class="pill" text-anchor="middle" fill="#FFFFFF">02</text><text x="420" y="327" class="cardTitle" text-anchor="start">证据成像</text><text x="354" y="366" class="body" text-anchor="start">四时钟时间线</text><text x="354" y="396" class="body" text-anchor="start">EvidenceSnapshot</text><text x="354" y="426" class="body" text-anchor="start">PIT 防前视查询</text><rect x="600" y="282" width="240" height="278" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="600" y="282" width="8" height="278" rx="4" fill="#7C5CE7"/><rect x="624" y="304" width="54" height="34" rx="17" fill="#7C5CE7" stroke="#7C5CE7" /><text x="651" y="327" class="pill" text-anchor="middle" fill="#FFFFFF">03</text><text x="694" y="327" class="cardTitle" text-anchor="start">智能体研判</text><text x="628" y="366" class="body" text-anchor="start">市场 / 题材 / 资金</text><text x="628" y="396" class="body" text-anchor="start">证据感知路由</text><text x="628" y="426" class="body" text-anchor="start">结构化模型边界</text><rect x="874" y="282" width="240" height="278" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="874" y="282" width="8" height="278" rx="4" fill="#E89422"/><rect x="898" y="304" width="54" height="34" rx="17" fill="#E89422" stroke="#E89422" /><text x="925" y="327" class="pill" text-anchor="middle" fill="#FFFFFF">04</text><text x="968" y="327" class="cardTitle" text-anchor="start">风险决策</text><text x="902" y="366" class="body" text-anchor="start">SignalFrame</text><text x="902" y="396" class="body" text-anchor="start">pass / reduce / block</text><text x="902" y="426" class="body" text-anchor="start">watch / avoid / abstain</text><rect x="1148" y="282" width="240" height="278" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)"/><rect x="1148" y="282" width="8" height="278" rx="4" fill="#1688D4"/><rect x="1172" y="304" width="54" height="34" rx="17" fill="#1688D4" stroke="#1688D4" /><text x="1199" y="327" class="pill" text-anchor="middle" fill="#FFFFFF">05</text><text x="1242" y="327" class="cardTitle" text-anchor="start">回放开放</text><text x="1176" y="366" class="body" text-anchor="start">同一 run_cycle</text><text x="1176" y="396" class="body" text-anchor="start">验证与三层归因</text><text x="1176" y="426" class="body" text-anchor="start">API / SDK / CLI / Web</text><path d="M 294 420 L 318 420" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)"/><path d="M 568 420 L 592 420" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)"/><path d="M 842 420 L 866 420" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1116 420 L 1140 420" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)"/><rect x="202" y="608" width="1036" height="68" rx="22" fill="#EEF1FF" stroke="#C9D0FF" /><text x="720" y="638" class="cardTitle" text-anchor="middle">闭环反馈：回放结果与归因用于校验证据质量、路由规则和风险条件</text><text x="720" y="663" class="small" text-anchor="middle">不是直接下单的大脑，而是把每个研究结论变成可验证记录的研究系统</text><path d="M 1210 590 C 1210 708, 230 708, 230 590" fill="none" stroke="#5968F2" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="64" y="766" class="navCaption" text-anchor="start">五脑区导航｜从数据感知到验证反馈的完整认知链</text><rect x="64" y="792" width="216" height="58" rx="18" fill="#5968F2" stroke="#5968F2" filter="url(#shadow)"/><text x="98" y="828" class="navNumber" text-anchor="middle" fill="#FFFFFF">01</text><text x="134" y="827" class="navLabel" text-anchor="start" fill="#FFFFFF">全脑总览</text><path d="M 286 821 L 316 821" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)"/><rect x="328" y="792" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" /><text x="362" y="828" class="navNumber" text-anchor="middle" fill="#64748B">02</text><text x="398" y="827" class="navLabel" text-anchor="start" fill="#0F172A">证据感知</text><path d="M 550 821 L 580 821" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)"/><rect x="592" y="792" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" /><text x="626" y="828" class="navNumber" text-anchor="middle" fill="#64748B">03</text><text x="662" y="827" class="navLabel" text-anchor="start" fill="#0F172A">智能体研判</text><path d="M 814 821 L 844 821" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)"/><rect x="856" y="792" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" /><text x="890" y="828" class="navNumber" text-anchor="middle" fill="#64748B">04</text><text x="926" y="827" class="navLabel" text-anchor="start" fill="#0F172A">风险决策</text><path d="M 1078 821 L 1108 821" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)"/><rect x="1120" y="792" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" /><text x="1154" y="828" class="navNumber" text-anchor="middle" fill="#64748B">05</text><text x="1190" y="827" class="navLabel" text-anchor="start" fill="#0F172A">回放与开放</text>
</svg>