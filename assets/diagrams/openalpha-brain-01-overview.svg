  <text x="88" y="395" class="body" fill="#96A8BE" text-anchor="start" opacity="1">用户自有 CSV / JSONL / Parquet</text>
  <text x="88" y="419" class="body" fill="#96A8BE" text-anchor="start" opacity="1">Provider 合同 · 鉴权 · 限流</text>
  <text x="88" y="443" class="body" fill="#96A8BE" text-anchor="start" opacity="1">来源 / 许可 / 修订语义</text>
