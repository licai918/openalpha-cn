  <text x="740" y="531" class="body" fill="#96A8BE" text-anchor="start" opacity="1">同路径回放 · 事件统计</text>
  <text x="740" y="555" class="body" fill="#96A8BE" text-anchor="start" opacity="1">组合报告 · 结构化筛选</text>
