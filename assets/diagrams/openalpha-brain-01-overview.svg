  <text x="398" y="273" class="micro" fill="#2DD4BF" text-anchor="start" opacity="1">01 / 证据成像</text>
  <text x="398" y="306" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">EvidenceSnapshot</text>
  <text x="398" y="335" class="body" fill="#96A8BE" text-anchor="start" opacity="1">四时钟 PIT</text>
  <text x="398" y="359" class="body" fill="#96A8BE" text-anchor="start" opacity="1">内容寻址 · 来源与许可</text>
