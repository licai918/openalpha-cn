  <text x="1094" y="323" class="body" fill="#96A8BE" text-anchor="start" opacity="1">RunManifest / DecisionLedger</text>
  <text x="1094" y="347" class="body" fill="#96A8BE" text-anchor="start" opacity="1">Checkpoint · SQLite WAL</text>
  <text x="1094" y="371" class="body" fill="#96A8BE" text-anchor="start" opacity="1">Retry / Recovery · 成本账本</text>
  <text x="1094" y="395" class="body" fill="#96A8BE" text-anchor="start" opacity="1">证据不足时显式 abstain</text>
  <text x="1094" y="419" class="body" fill="#96A8BE" text-anchor="start" opacity="1">API / SDK / CLI / Web 同契约</text>
