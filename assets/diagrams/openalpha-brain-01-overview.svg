  <text x="356.5" y="435" class="small" fill="#2DD4BF" text-anchor="middle" opacity="1">规范化</text>
  <circle cx="1081" cy="210" r="14" fill="#FB7185" fill-opacity=".16" stroke="#FB7185" stroke-opacity=".45" />
  <text x="1081" y="214" class="navNum" fill="#FB7185" text-anchor="middle" opacity="1">C</text>
  <text x="1105" y="214" class="micro" fill="#FB7185" text-anchor="start" opacity="1">系统级保证</text>
  <rect x="1070" y="232" width="306" height="274" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="1071" y="233" width="304" height="272" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
