  <text x="375" y="838" class="nav" fill="#F4F7FB" text-anchor="start" opacity="1">证据平面</text>
  <path d="M565 832H571" stroke="#2DD4BF" stroke-width="1.7" marker-end="url(#arrow)" />
  <rect x="576" y="806" width="240" height="52" rx="16" fill="#0B1726" stroke="#263A52" />
  <text x="598" y="838" class="navNum" fill="#647890" text-anchor="start" opacity="1">03</text>
  <text x="631" y="838" class="nav" fill="#B7C4D4" text-anchor="start" opacity="1">研究编排</text>
  <path d="M821 832H827" stroke="#263A52" stroke-width="1.7" marker-end="url(#arrow)" />
