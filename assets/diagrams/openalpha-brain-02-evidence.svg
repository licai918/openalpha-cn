  <text x="396" y="384" class="body" text-anchor="start">Bearer 认证 · 客户端限流</text>
  <text x="396" y="414" class="body" text-anchor="start">PIT 可见性 · 数据修订</text>
  <text x="396" y="444" class="body" text-anchor="start">来源 · 许可 · 新鲜度</text>
  <text x="396" y="474" class="body" text-anchor="start">认证 / 限流 / 服务错误分类</text>
  <text x="396" y="504" class="body" text-anchor="start">失败显式 · 禁止空成功</text>
  <text x="748" y="205" class="kicker" text-anchor="start" fill="#0F9F8F">四时钟时间线</text>
  <rect x="674" y="228" width="154" height="86" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
