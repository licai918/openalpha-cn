<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">先证明“当时可知”，再讨论模型是否聪明</title>
  <desc id="desc">所有研究结论先经过授权、限流、四时钟与内容寻址，得到可追溯、可回放的 EvidenceSnapshot。</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091727" />
      <stop offset=".48" stop-color="#07111E" />
      <stop offset="1" stop-color="#050C16" />
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1160 40) rotate(135) scale(600 420)">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".16" />
      <stop offset=".62" stop-color="#2DD4BF" stop-opacity=".025" />
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="activeNav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".30" />
      <stop offset="1" stop-color="#2DD4BF" stop-opacity=".08" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity=".34" />
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6D87A3" stroke-width=".55" opacity=".12" />
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L11 5.5L0 11Z" fill="context-stroke" />
    </marker>
    <style>
      text { font-family: Geist, "Plus Jakarta Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 760; letter-spacing: 1.8px; }
      .title { font-size: 34px; font-weight: 760; letter-spacing: -.5px; }
      .subtitle { font-size: 16px; font-weight: 480; }
      .micro { font-size: 11px; font-weight: 760; letter-spacing: 1.25px; }
      .cardTitle { font-size: 20px; font-weight: 720; }
      .body { font-size: 14px; font-weight: 490; }
      .small { font-size: 12px; font-weight: 520; }
      .mono { font-size: 12px; font-weight: 680; font-family: Geist Mono, "Noto Sans Mono CJK SC", monospace; }
      .metric { font-size: 28px; font-weight: 780; letter-spacing: -.5px; }
      .nav { font-size: 13px; font-weight: 680; }
      .navNum { font-size: 12px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#07111E" />
  <rect width="1440" height="900" fill="url(#bgGradient)" />
  <rect width="1440" height="900" fill="url(#ambient)" />
  <rect width="1440" height="900" fill="url(#grid)" />
  <rect x="64" y="42" width="42" height="4" rx="2" fill="#2DD4BF" filter="url(#softGlow)" />
  <text x="64" y="72" class="eyebrow" fill="#2DD4BF">OPENALPHA CN · RESEARCH OS / 02</text>
  <text x="64" y="115" class="title" fill="#F4F7FB">证据平面｜先证明“当时可知”，再讨论模型是否聪明</text>
  <text x="64" y="148" class="subtitle" fill="#96A8BE">所有研究结论先经过授权、限流、四时钟与内容寻址，得到可追溯、可回放的 EvidenceSnapshot。</text>
  <g transform="translate(1210 50)" opacity=".92">
    <circle cx="44" cy="30" r="28" fill="#2DD4BF" opacity=".09" />
    <path d="M18 42L40 20L56 32L75 11" fill="none" stroke="#2DD4BF" stroke-width="2.2" />
    <circle cx="18" cy="42" r="4" fill="#2DD4BF" /><circle cx="40" cy="20" r="4" fill="#2DD4BF" />
    <circle cx="56" cy="32" r="4" fill="#2DD4BF" /><circle cx="75" cy="11" r="4" fill="#2DD4BF" />
  </g>
  <line x1="898" y1="171" x2="938" y2="171" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="948" y="175" class="small" fill="#96A8BE" text-anchor="start" opacity="1">自动执行 / 持久化</text>
  <line x1="1108" y1="171" x2="1148" y2="171" stroke="#FBBF24" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#arrow)" />
  <text x="1158" y="175" class="small" fill="#96A8BE" text-anchor="start" opacity="1">显式组合 / 人工反馈</text>
  <circle cx="76" cy="210" r="14" fill="#2DD4BF" fill-opacity=".16" stroke="#2DD4BF" stroke-opacity=".45" />
  <text x="76" y="214" class="navNum" fill="#2DD4BF" text-anchor="middle" opacity="1">A</text>
  <text x="100" y="214" class="micro" fill="#2DD4BF" text-anchor="start" opacity="1">授权输入</text>
  <rect x="64" y="232" width="250" height="190" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="65" y="233" width="248" height="188" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
  <rect x="64" y="254" width="3" height="146" rx="1.5" fill="#2DD4BF" />
  <text x="88" y="261" class="micro" fill="#2DD4BF" text-anchor="start" opacity="1">LICENSED DATA</text>
  <text x="88" y="294" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">链邻数据接口 API</text>
  <text x="88" y="323" class="body" fill="#96A8BE" text-anchor="start" opacity="1">已实现 · 统一替代入口</text>
  <text x="88" y="347" class="body" fill="#96A8BE" text-anchor="start" opacity="1">Bearer 鉴权 · 客户端限流</text>
  <text x="88" y="371" class="body" fill="#96A8BE" text-anchor="start" opacity="1">时效 / 精度以链邻服务为准</text>
  <rect x="64" y="440" width="250" height="150" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="65" y="441" width="248" height="148" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
  <rect x="64" y="462" width="3" height="106" rx="1.5" fill="#38BDF8" />
  <text x="88" y="469" class="micro" fill="#38BDF8" text-anchor="start" opacity="1">OWNED DATA</text>
  <text x="88" y="502" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">用户自有文件</text>
  <text x="88" y="531" class="body" fill="#96A8BE" text-anchor="start" opacity="1">CSV · JSON · JSONL · Parquet</text>
  <text x="88" y="555" class="body" fill="#96A8BE" text-anchor="start" opacity="1">来源与许可元数据随批次进入</text>
  <rect x="81" y="612" width="216" height="28" rx="14" fill="#FB7185" fill-opacity="0.12" stroke="#FB7185" stroke-opacity=".38" />
  <text x="189.0" y="631" class="small" fill="#FB7185" text-anchor="middle" opacity="1">失败显式 · 禁止空成功</text>
  <circle cx="359" cy="210" r="14" fill="#A78BFA" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".45" />
  <text x="359" y="214" class="navNum" fill="#A78BFA" text-anchor="middle" opacity="1">B</text>
  <text x="383" y="214" class="micro" fill="#A78BFA" text-anchor="start" opacity="1">数据入口闸门</text>
  <rect x="348" y="232" width="274" height="380" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="349" y="233" width="272" height="378" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
  <rect x="348" y="254" width="3" height="336" rx="1.5" fill="#A78BFA" />
  <text x="372" y="261" class="micro" fill="#A78BFA" text-anchor="start" opacity="1">NORMALIZE &amp; GOVERN</text>
  <text x="372" y="294" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">Provider Contract</text>
  <text x="372" y="323" class="body" fill="#96A8BE" text-anchor="start" opacity="1">ProviderMetadata / ProviderBatch</text>
  <text x="372" y="347" class="body" fill="#96A8BE" text-anchor="start" opacity="1">认证 · 限流 · 新鲜度</text>
  <text x="372" y="371" class="body" fill="#96A8BE" text-anchor="start" opacity="1">错误分类与 Retry-After</text>
  <text x="372" y="395" class="body" fill="#96A8BE" text-anchor="start" opacity="1">PIT 可见性与修订语义</text>
  <text x="372" y="419" class="body" fill="#96A8BE" text-anchor="start" opacity="1">涨停 / 炸板 / 连板 / 题材</text>
  <text x="372" y="443" class="body" fill="#96A8BE" text-anchor="start" opacity="1">催化 / 公告 / 资金语义</text>
  <text x="372" y="467" class="body" fill="#96A8BE" text-anchor="start" opacity="1">统一 schema 后才可进入研究</text>
  <path d="M314 327L348 327" fill="none" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arrow)" />
  <path d="M314 514L348 514" fill="none" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow)" />
  <circle cx="670" cy="210" r="14" fill="#2DD4BF" fill-opacity=".16" stroke="#2DD4BF" stroke-opacity=".45" />
  <text x="670" y="214" class="navNum" fill="#2DD4BF" text-anchor="middle" opacity="1">C</text>
  <text x="694" y="214" class="micro" fill="#2DD4BF" text-anchor="start" opacity="1">四时钟 PIT</text>
  <rect x="658" y="232" width="160" height="92" rx="18" fill="#13243A" stroke="#2DD4BF" stroke-opacity=".28" />
  <text x="738" y="270" class="cardTitle" fill="#F4F7FB" text-anchor="middle" opacity="1">事件发生</text>
  <text x="738" y="298" class="mono" fill="#2DD4BF" text-anchor="middle" opacity="1">event_time</text>
  <rect x="837" y="232" width="160" height="92" rx="18" fill="#13243A" stroke="#2DD4BF" stroke-opacity=".28" />
  <text x="917" y="270" class="cardTitle" fill="#F4F7FB" text-anchor="middle" opacity="1">首次可知</text>
  <text x="917" y="298" class="mono" fill="#2DD4BF" text-anchor="middle" opacity="1">available_time</text>
  <rect x="1016" y="232" width="160" height="92" rx="18" fill="#13243A" stroke="#2DD4BF" stroke-opacity=".28" />
  <text x="1096" y="270" class="cardTitle" fill="#F4F7FB" text-anchor="middle" opacity="1">系统入库</text>
  <text x="1096" y="298" class="mono" fill="#2DD4BF" text-anchor="middle" opacity="1">ingested_time</text>
  <rect x="1195" y="232" width="160" height="92" rx="18" fill="#13243A" stroke="#2DD4BF" stroke-opacity=".28" />
  <text x="1275" y="270" class="cardTitle" fill="#F4F7FB" text-anchor="middle" opacity="1">数据修订</text>
  <text x="1275" y="298" class="mono" fill="#2DD4BF" text-anchor="middle" opacity="1">revision_time</text>
  <rect x="658" y="350" width="454" height="200" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="659" y="351" width="452" height="198" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
  <rect x="658" y="372" width="3" height="156" rx="1.5" fill="#2DD4BF" />
  <text x="682" y="379" class="micro" fill="#2DD4BF" text-anchor="start" opacity="1">CONTENT-ADDRESSED ARTIFACT</text>
  <text x="682" y="412" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">EvidenceSnapshot</text>
  <text x="682" y="441" class="body" fill="#96A8BE" text-anchor="start" opacity="1">evidence_id = hash(source_uri + content_hash)</text>
  <text x="682" y="465" class="body" fill="#96A8BE" text-anchor="start" opacity="1">可见时点 · 哈希 · 来源 · 许可 · 修订</text>
  <text x="682" y="489" class="body" fill="#96A8BE" text-anchor="start" opacity="1">A 股事件语义与原始载荷建立绑定</text>
  <text x="682" y="513" class="body" fill="#96A8BE" text-anchor="start" opacity="1">下游只接收决策时刻已经可知的 evidence_id</text>
  <path d="M622 421L658 421" fill="none" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="640.0" y="405" class="small" fill="#2DD4BF" text-anchor="middle" opacity="1">固化</text>
  <rect x="1142" y="350" width="214" height="200" rx="22" fill="#0C1928" stroke="#263A52" filter="url(#shadow)" />
  <rect x="1143" y="351" width="212" height="198" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
  <rect x="1142" y="372" width="3" height="156" rx="1.5" fill="#38BDF8" />
  <text x="1166" y="379" class="micro" fill="#38BDF8" text-anchor="start" opacity="1">IMMUTABLE STORE</text>
  <text x="1166" y="412" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">证据存储</text>
  <text x="1166" y="441" class="body" fill="#96A8BE" text-anchor="start" opacity="1">Parquet 分区</text>
  <text x="1166" y="465" class="body" fill="#96A8BE" text-anchor="start" opacity="1">DuckDB PIT 查询</text>
  <text x="1166" y="489" class="body" fill="#96A8BE" text-anchor="start" opacity="1">只读证据工具</text>
  <text x="1166" y="513" class="body" fill="#96A8BE" text-anchor="start" opacity="1">内容哈希复核</text>
  <path d="M1112 450L1142 450" fill="none" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow)" />
  <rect x="658" y="578" width="698" height="92" rx="20" fill="#102033" stroke="#263A52" />
  <text x="684" y="608" class="micro" fill="#38BDF8" text-anchor="start" opacity="1">QUERY CONTRACT</text>
  <text x="684" y="646" class="cardTitle" fill="#F4F7FB" text-anchor="start" opacity="1">as_of + symbol / event_type → 可见证据集合 → EvidenceSnapshot</text>
  <rect x="1163" y="588" width="168" height="28" rx="14" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-opacity=".38" />
  <text x="1247.0" y="607" class="small" fill="#2DD4BF" text-anchor="middle" opacity="1">交付研判脑区 →</text>
  <text x="64" y="785" class="micro" fill="#96A8BE" text-anchor="start" opacity="1">研究闭环导航</text>
  <text x="200" y="785" class="small" fill="#6F829A" text-anchor="start" opacity="1">每一脑区交付一个可验证产物，最终回到下一轮证据与规则</text>
  <rect x="64" y="806" width="240" height="52" rx="16" fill="#0B1726" stroke="#263A52" />
  <text x="86" y="838" class="navNum" fill="#647890" text-anchor="start" opacity="1">01</text>
  <text x="119" y="838" class="nav" fill="#B7C4D4" text-anchor="start" opacity="1">系统总览</text>
  <path d="M309 832H315" stroke="#263A52" stroke-width="1.7" marker-end="url(#arrow)" />
  <rect x="320" y="806" width="240" height="52" rx="16" fill="url(#activeNav)" stroke="#2DD4BF" stroke-opacity=".64" />
