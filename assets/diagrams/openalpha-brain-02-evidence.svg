<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">证据感知｜先回答“当时能不能知道”</title>
  <desc id="desc">链邻统一入口先通过认证、限流、PIT 与错误分类，再生成来源、时间、修订和内容哈希可追溯的证据。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#27324A" flood-opacity=".10" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" />
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D8DEEB" />
    </pattern>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 760; fill: #0F172A; letter-spacing: -.5px; }
      .subtitle { font-size: 19px; font-weight: 450; fill: #64748B; }
      .cardTitle { font-size: 23px; font-weight: 720; fill: #0F172A; }
      .kicker { font-size: 14px; font-weight: 760; letter-spacing: 1.2px; }
      .body { font-size: 17px; font-weight: 470; fill: #334155; }
      .small { font-size: 15px; font-weight: 500; fill: #64748B; }
      .pill { font-size: 14px; font-weight: 760; letter-spacing: .4px; }
      .metric { font-size: 28px; font-weight: 780; fill: #0F172A; }
      .navCaption { font-size: 15px; font-weight: 650; fill: #64748B; letter-spacing: .4px; }
      .navNumber { font-size: 15px; font-weight: 800; }
      .navLabel { font-size: 17px; font-weight: 720; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F7F8FC" />
  <rect width="1440" height="900" fill="url(#dots)" opacity=".36" />
  <rect x="64" y="46" width="158" height="34" rx="17" fill="#0F9F8F" stroke="#0F9F8F" />
  <text x="143" y="69" class="pill" text-anchor="middle" fill="#FFFFFF">OPENALPHA · 02</text>
  <text x="64" y="116" class="title" text-anchor="start">证据感知｜先回答“当时能不能知道”</text>
  <text x="64" y="154" class="subtitle" text-anchor="start">链邻统一入口先通过认证、限流、PIT 与错误分类，再生成来源、时间、修订和内容哈希可追溯的证据。</text>
