  <text x="1279" y="288" class="small" text-anchor="middle">revision_time</text>
  <rect x="742" y="350" width="510" height="172" rx="22" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="742" y="350" width="8" height="172" rx="4" fill="#0F9F8F" />
  <text x="770" y="385" class="kicker" text-anchor="start" fill="#0F9F8F">不可变 · 内容寻址</text>
  <text x="770" y="422" class="cardTitle" text-anchor="start">EvidenceSnapshot</text>
  <text x="770" y="458" class="body" text-anchor="start">evidence_id + source_uri + content_hash</text>
  <text x="770" y="488" class="body" text-anchor="start">A 股语义：涨停 / 炸板 / 连板 / 题材 / 催化 / 公告 / 资金</text>
  <rect x="678" y="570" width="648" height="74" rx="20" fill="#E9F8F5" stroke="#B7E8DE" />
  <text x="1002" y="600" class="cardTitle" text-anchor="middle">Parquet 分区  →  DuckDB PIT 查询  →  只读证据工具</text>
  <text x="1002" y="627" class="small" text-anchor="middle">只向下一脑区交付决策时刻已经可见的 evidence_id</text>
