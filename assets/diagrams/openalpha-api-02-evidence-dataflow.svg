<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">证据数据链｜Provider 数据如何变成可研究事实</title>
  <desc id="desc">先在调用侧取得合法数据，再以 ProviderMetadata + ProviderBatch 进入统一构建、四时钟校验与内容寻址。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#27324A" flood-opacity=".10" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" />
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D8DEEB" />
    </pattern>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 760; fill: #0F172A; letter-spacing: -.4px; }
      .subtitle { font-size: 18px; font-weight: 450; fill: #64748B; }
      .section { font-size: 14px; font-weight: 800; letter-spacing: 1.1px; }
      .cardTitle { font-size: 21px; font-weight: 760; fill: #0F172A; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 520; fill: #64748B; }
      .endpoint { font-size: 14px; font-weight: 720; fill: #26324A; }
      .pill { font-size: 14px; font-weight: 780; letter-spacing: .35px; }
      .arrowLabel { font-size: 13px; font-weight: 700; fill: #64748B; }
      .navCaption { font-size: 15px; font-weight: 650; fill: #64748B; letter-spacing: .4px; }
      .navNumber { font-size: 15px; font-weight: 800; }
      .navLabel { font-size: 17px; font-weight: 720; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#F7F8FC" />
  <rect width="1440" height="900" fill="url(#dots)" opacity=".36" />
  <rect x="64" y="42" width="188" height="34" rx="17" fill="#5968F2" />
  <text x="158" y="65" class="pill" text-anchor="middle" fill="#FFFFFF">OPENALPHA · API 02</text>
  <text x="64" y="112" class="title">证据数据链｜Provider 数据如何变成可研究事实</text>
  <text x="64" y="148" class="subtitle">先在调用侧取得合法数据，再以 ProviderMetadata + ProviderBatch 进入统一构建、四时钟校验与内容寻址。</text>
  <text x="64" y="194" class="section" fill="#0F9F8F">调用方 / Provider 侧</text>
  <rect x="64" y="220" width="246" height="36" rx="18" fill="#FFFFFF" stroke="#0F9F8F" />
  <text x="187" y="244" class="pill" text-anchor="middle" fill="#0F9F8F">链邻 API · 用户授权</text>
  <rect x="64" y="270" width="246" height="36" rx="18" fill="#FFFFFF" stroke="#0F9F8F" />
  <text x="187" y="294" class="pill" text-anchor="middle" fill="#0F9F8F">CSV / JSONL / Parquet</text>
  <rect x="64" y="320" width="246" height="36" rx="18" fill="#FFFFFF" stroke="#0F9F8F" />
  <text x="187" y="344" class="pill" text-anchor="middle" fill="#0F9F8F">Tushare · 用户 Token</text>
  <rect x="64" y="370" width="246" height="36" rx="18" fill="#FFFFFF" stroke="#0F9F8F" />
  <text x="187" y="394" class="pill" text-anchor="middle" fill="#0F9F8F">AKShare · 可选研究</text>
  <rect x="352" y="220" width="252" height="220" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="352" y="220" width="7" height="220" rx="3.5" fill="#0F9F8F" />
  <text x="376" y="252" class="cardTitle">统一 Provider 合同</text>
  <text x="376" y="280" class="body">ProviderMetadata</text>
  <text x="376" y="305" class="body">ProviderBatch</text>
  <text x="376" y="330" class="body">来源 / 许可 / 修订</text>
  <text x="376" y="355" class="body">显式失败 / no_data_reason</text>
  <text x="376" y="380" class="body">服务端不自动抓取数据</text>
  <path d="M 312 330 L 344 330" fill="none" stroke="#0F9F8F" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 628 188 L 628 590" fill="none" stroke="#B9C2D0" stroke-width="2" stroke-dasharray="6 7" />
  <text x="640" y="208" class="small">OpenAlpha HTTP 服务端边界</text>
  <rect x="670" y="220" width="300" height="220" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="670" y="220" width="7" height="220" rx="3.5" fill="#5968F2" />
  <text x="694" y="252" class="cardTitle">构建与校验</text>
  <rect x="692" y="262" width="258" height="27" rx="9" fill="#5968F2" opacity=".10" />
  <text x="702" y="281" class="endpoint">POST /api/v1/evidence/build</text>
  <text x="694" y="316" class="body">Schema / aware datetime</text>
  <text x="694" y="341" class="body">四时钟 PIT</text>
  <text x="694" y="366" class="body">涨停 / 炸板 / 连板规范化</text>
  <text x="694" y="391" class="body">题材 / 催化 / 公告 / 资金</text>
  <path d="M 606 330 L 662 330" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1012" y="220" width="352" height="220" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="1012" y="220" width="7" height="220" rx="3.5" fill="#7C5CE7" />
  <text x="1036" y="252" class="cardTitle">不可变 EvidenceSnapshot</text>
  <text x="1036" y="280" class="body">evidence_id + content_hash</text>
  <text x="1036" y="305" class="body">event / available / ingested / revision</text>
  <text x="1036" y="330" class="body">source_id / URI / license</text>
  <text x="1036" y="355" class="body">只保留 as_of 时刻可见事实</text>
  <path d="M 972 330 L 1004 330" fill="none" stroke="#7C5CE7" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="352" y="500" width="252" height="162" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="352" y="500" width="7" height="162" rx="3.5" fill="#1688D4" />
  <text x="376" y="532" class="cardTitle">查询视图</text>
  <text x="376" y="560" class="body">GET /api/v1/evidence</text>
  <text x="376" y="585" class="body">GET /api/v1/market/events</text>
  <text x="376" y="610" class="body">GET /api/v1/themes</text>
  <rect x="670" y="500" width="300" height="162" rx="18" fill="#F2F4F8" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="670" y="500" width="7" height="162" rx="3.5" fill="#64748B" />
  <text x="694" y="532" class="cardTitle">PIT 证据存储</text>
  <text x="694" y="560" class="body">ParquetEvidenceStore</text>
  <text x="694" y="585" class="body">DuckDB as_of 查询</text>
  <text x="694" y="610" class="body">追加写入 · 防前视</text>
  <path d="M 1188 446 C 1188 476, 820 470, 820 492" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 662 580 L 612 580" fill="none" stroke="#1688D4" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1012" y="500" width="352" height="162" rx="18" fill="#FFFFFF" stroke="#D9DFEA" filter="url(#shadow)" />
  <rect x="1012" y="500" width="7" height="162" rx="3.5" fill="#7C5CE7" />
  <text x="1036" y="532" class="cardTitle">下游研究输入</text>
  <text x="1036" y="560" class="body">ResearchRunRequest.evidence</text>
  <text x="1036" y="585" class="body">subject / as_of 一致性</text>
  <text x="1036" y="610" class="body">Evidence ID 全链引用</text>
  <path d="M 972 580 L 1004 580" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <path d="M 72 732 L 126 732" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)" />
  <text x="140" y="737" class="small">服务端自动调用 / 持久化</text>
  <path d="M 380 732 L 434 732" fill="none" stroke="#E89422" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" />
  <text x="448" y="737" class="small">调用方显式组合 / 反馈</text>
  <rect x="746" y="717" width="16" height="16" rx="4" fill="#64748B" opacity=".16" stroke="#64748B" />
  <text x="774" y="737" class="small">SQLite / Parquet 持久状态</text>
  <text x="1060" y="737" class="small">边界：不连接实盘券商</text>
  <text x="64" y="780" class="navCaption">API 关系导航｜从数据合同到验证反馈的五层公开能力</text>
  <rect x="64" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="98" y="838" class="navNumber" text-anchor="middle" fill="#64748B">01</text>
  <text x="134" y="837" class="navLabel" fill="#0F172A">API 全景</text>
  <path d="M 286 831 L 316 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="328" y="802" width="216" height="58" rx="18" fill="#5968F2" stroke="#5968F2" filter="url(#shadow)" />
  <text x="362" y="838" class="navNumber" text-anchor="middle" fill="#FFFFFF">02</text>
  <text x="398" y="837" class="navLabel" fill="#FFFFFF">证据数据</text>
  <path d="M 550 831 L 580 831" fill="none" stroke="#5968F2" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="592" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="626" y="838" class="navNumber" text-anchor="middle" fill="#64748B">03</text>
  <text x="662" y="837" class="navLabel" fill="#0F172A">研究编排</text>
  <path d="M 814 831 L 844 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="856" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="890" y="838" class="navNumber" text-anchor="middle" fill="#64748B">04</text>
  <text x="926" y="837" class="navLabel" fill="#0F172A">决策产品</text>
  <path d="M 1078 831 L 1108 831" fill="none" stroke="#C5CDDA" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1120" y="802" width="216" height="58" rx="18" fill="#FFFFFF" stroke="#D7DDE8" />
  <text x="1154" y="838" class="navNumber" text-anchor="middle" fill="#64748B">05</text>
  <text x="1190" y="837" class="navLabel" fill="#0F172A">验证闭环</text>
</svg>
