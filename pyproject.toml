[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project]
name = "openalpha-cn"
version = "1.0.0"
description = "Evidence-traceable, point-in-time multi-agent research for China A shares"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ss8875" }]
keywords = ["a-share", "multi-agent", "quant-research", "point-in-time"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "duckdb>=1.5,<2",
  "fastapi>=0.135,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.15,<3",
  "pytz>=2025.2",
  "typer>=0.21.0,<1",
  "tzdata>=2025.2",
  "uvicorn>=0.41,<1",
]

[project.urls]
Homepage = "https://github.com/ss8875/openalpha-cn"
Documentation = "https://github.com/ss8875/openalpha-cn/tree/main/docs"
Issues = "https://github.com/ss8875/openalpha-cn/issues"

[project.scripts]
openalpha = "openalpha_cn.cli:main"

[project.optional-dependencies]
akshare = [
    "akshare>=1.18.38,<2",
]

[dependency-groups]
dev = [
  "httpx2>=2.9.0",
  "import-linter>=2.13,<3",
  "mypy>=1.19.0,<2",
  "pytest>=9.0.0,<10",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.15.0,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openalpha_cn"]

[[tool.mypy.overrides]]
# Optional AKShare transitive stubs may use the executing interpreter's syntax.
# Keep the core checked against Python 3.11 without type-checking third-party internals.
module = [
  "akshare",
  "akshare.*",
  "duckdb",
  "duckdb.*",
  "numpy",
  "numpy.*",
  "pandas",
  "pandas.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["openalpha_cn"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

# ADR-0001 guardrail: "Domain and provider contracts must not import SQLite or DuckDB
# implementation types." The 7 `ignore_imports` entries below are a hand-maintained,
# shrink-only baseline of pre-existing violations; see
# `docs/architecture/import-layering-baseline.toml` for the human-readable ledger (module,
# banned import, and the P0.B issue that will close it) and
# `tests/unit/test_import_layering.py` for the tests that pin this baseline and prove the
# gate is live. Do not add new `ignore_imports` entries — a new violation must be fixed,
# not exempted.
[tool.importlinter]
root_package = "openalpha_cn"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-purity"
name = "domain imports no numeric/infra library and no sibling openalpha_cn subpackage"
type = "forbidden"
source_modules = ["openalpha_cn.domain"]
forbidden_modules = [
  "numpy",
  "pandas",
  "scipy",
  "sklearn",
  "duckdb",
  "sqlite3",
  "openalpha_cn.agents",
  "openalpha_cn.api",
  "openalpha_cn.backtest",
  "openalpha_cn.decisions",
  "openalpha_cn.evidence",
  "openalpha_cn.models",
  "openalpha_cn.product",
  "openalpha_cn.providers",
  "openalpha_cn.runtime",
  "openalpha_cn.storage",
  "openalpha_cn.tools",
]

[[tool.importlinter.contracts]]
id = "storage-no-upward-deps"
name = "storage does not depend upward on agents, runtime, product, or backtest"
type = "forbidden"
source_modules = ["openalpha_cn.storage"]
forbidden_modules = [
  "openalpha_cn.agents",
  "openalpha_cn.runtime",
  "openalpha_cn.product",
  "openalpha_cn.backtest",
]
# Baseline (V2-P0B-012) — 5 entries, see docs/architecture/import-layering-baseline.toml
ignore_imports = [
  "openalpha_cn.storage.memory -> openalpha_cn.runtime.memory",
  "openalpha_cn.storage.portfolio -> openalpha_cn.backtest.portfolio",
  "openalpha_cn.storage.batch -> openalpha_cn.runtime.batch",
  "openalpha_cn.storage.recovery -> openalpha_cn.agents.base",
  "openalpha_cn.storage.product -> openalpha_cn.product.research",
]

[[tool.importlinter.contracts]]
id = "providers-no-infra-imports"
name = "providers do not import duckdb or sqlite3"
type = "forbidden"
source_modules = ["openalpha_cn.providers"]
forbidden_modules = ["duckdb", "sqlite3"]
# Baseline (V2-P0B-011) — 1 entry, see docs/architecture/import-layering-baseline.toml
ignore_imports = [
  "openalpha_cn.providers.file -> duckdb",
]

[[tool.importlinter.contracts]]
id = "models-no-infra-imports"
name = "models do not import duckdb or sqlite3"
type = "forbidden"
source_modules = ["openalpha_cn.models"]
forbidden_modules = ["duckdb", "sqlite3"]
# Baseline (V2-P0B-011) — 1 entry, see docs/architecture/import-layering-baseline.toml
ignore_imports = [
  "openalpha_cn.models.governance -> sqlite3",
]
