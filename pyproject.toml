[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project]
name = "openalpha-cn"
version = "1.0.0"
description = "Evidence-traceable, point-in-time multi-agent research for China A shares"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ss8875" }]
keywords = ["a-share", "multi-agent", "quant-research", "point-in-time"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "duckdb>=1.5,<2",
  "fastapi>=0.135,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.15,<3",
  "python-dotenv>=1.1,<2",
  "pytz>=2025.2",
  "typer>=0.21.0,<1",
  "tzdata>=2025.2",
  "uvicorn>=0.41,<1",
]

[project.urls]
Homepage = "https://github.com/ss8875/openalpha-cn"
Documentation = "https://github.com/ss8875/openalpha-cn/tree/main/docs"
Issues = "https://github.com/ss8875/openalpha-cn/issues"

[project.scripts]
openalpha = "openalpha_cn.cli:main"

[project.optional-dependencies]
akshare = [
    "akshare>=1.18.38,<2",
]

[dependency-groups]
dev = [
  "httpx2>=2.9.0",
  "import-linter>=2.13,<3",
  "mypy>=1.19.0,<2",
  "pytest>=9.0.0,<10",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.15.0,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openalpha_cn"]

[[tool.mypy.overrides]]
# Optional AKShare transitive stubs may use the executing interpreter's syntax.
# Keep the core checked against Python 3.11 without type-checking third-party internals.
module = [
  "akshare",
  "akshare.*",
  "duckdb",
  "duckdb.*",
  "numpy",
  "numpy.*",
  "pandas",
  "pandas.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["openalpha_cn"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

# ADR-0001 guardrail: "Domain and provider contracts must not import SQLite or DuckDB
# implementation types." Any contract below may carry a hand-maintained, shrink-only
# baseline of pre-existing violations as an `ignore_imports` list; see
# `docs/architecture/import-layering-baseline.toml` for the human-readable ledger (module,
# banned import, and the P0.B issue that will close it) and
# `tests/unit/test_import_layering.py` for the tests that pin this baseline and prove the
# gate is live. Do not add new `ignore_imports` entries — a new violation must be fixed,
# not exempted. The baseline is empty today (V2-P0B-012 closed the last 5 entries, all on
# `storage-no-upward-deps`); no contract below currently declares `ignore_imports` at all.
[tool.importlinter]
root_package = "openalpha_cn"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-purity"
name = "domain imports no numeric/infra library and no sibling openalpha_cn subpackage"
type = "forbidden"
source_modules = ["openalpha_cn.domain"]
forbidden_modules = [
  "numpy",
  "pandas",
  "scipy",
  "sklearn",
  "duckdb",
  "sqlite3",
  "openalpha_cn.agents",
  "openalpha_cn.api",
  "openalpha_cn.backtest",
  "openalpha_cn.decisions",
  "openalpha_cn.evidence",
  "openalpha_cn.models",
  "openalpha_cn.product",
  "openalpha_cn.providers",
  "openalpha_cn.runtime",
  "openalpha_cn.storage",
  "openalpha_cn.tools",
]

[[tool.importlinter.contracts]]
id = "storage-no-upward-deps"
name = "storage does not depend upward on agents, runtime, product, or backtest"
type = "forbidden"
source_modules = ["openalpha_cn.storage"]
forbidden_modules = [
  "openalpha_cn.agents",
  "openalpha_cn.runtime",
  "openalpha_cn.product",
  "openalpha_cn.backtest",
]
# V2-P0B-012 fixed all 5 baseline entries: storage/memory.py, storage/batch.py,
# storage/portfolio.py, storage/recovery.py, and storage/product.py each imported one data
# contract from above purely to serialize/deserialize it. Those contracts moved to
# openalpha_cn.domain (four of them) or, for BatchResearchTask/BatchProgressEvent (durable
# orchestration state, not a domain concept), a new neutral top-level module,
# openalpha_cn.batch_contracts — see that module's docstring. No exemptions remain: every
# storage/*.py file has zero direct edges into agents/runtime/product/backtest
# (tests/unit/test_import_layering.py proves this with grimp directly).
#
# V2-P0B-012's first version of this fix also added `allow_indirect_imports = true` here, to
# tolerate a real two-hop chain, storage.batch -> batch_contracts -> runtime.contracts, that
# batch_contracts.py needed for ResearchRunRequest. A Critical review rejected that:
# allow_indirect_imports scopes this contract to a direct-edges-only check instead of
# import-linter's default full transitive reachability, and a probe proved the gap was real
# -- a neutral top-level module importing a behavioural product class, reached in turn from a
# module under storage/, passed the relaxed contract (lint-imports reported it KEPT) while
# grimp's full reachability check saw the chain plainly (see
# tests/unit/test_import_layering.py::
# test_storage_no_upward_deps_contract_rejects_indirect_leak_via_neutral_module,
# which reproduces that exact probe against this contract). The fix was not to widen the
# contract but to remove the chain: ResearchRunRequest moved into
# openalpha_cn.domain.run_request (runtime/contracts.py re-exports it unchanged for existing
# callers), so openalpha_cn.batch_contracts now depends only on openalpha_cn.domain.* and this
# contract runs the default full-transitive-reachability check -- no allow_indirect_imports
# escape hatch.

[[tool.importlinter.contracts]]
id = "providers-no-infra-imports"
name = "providers do not import duckdb or sqlite3"
type = "forbidden"
source_modules = ["openalpha_cn.providers"]
forbidden_modules = ["duckdb", "sqlite3"]
# V2-P0B-011 fixed the sole baseline entry (providers.file -> duckdb); no exemptions remain.

[[tool.importlinter.contracts]]
id = "models-no-infra-imports"
name = "models do not import duckdb or sqlite3"
type = "forbidden"
source_modules = ["openalpha_cn.models"]
forbidden_modules = ["duckdb", "sqlite3"]
# V2-P0B-011 fixed the sole baseline entry (models.governance -> sqlite3); no exemptions remain.
