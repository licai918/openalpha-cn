[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project]
name = "openalpha-cn"
version = "0.1.0"
description = "Evidence-traceable, point-in-time multi-agent research for China A shares"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ss8875" }]
keywords = ["a-share", "multi-agent", "quant-research", "point-in-time"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "typer>=0.21.0,<1",
]

[project.urls]
Homepage = "https://github.com/ss8875/openalpha-cn"
Documentation = "https://github.com/ss8875/openalpha-cn/tree/main/docs"
Issues = "https://github.com/ss8875/openalpha-cn/issues"

[project.scripts]
openalpha = "openalpha_cn.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19.0,<2",
  "pytest>=9.0.0,<10",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.15.0,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openalpha_cn"]

[tool.coverage.run]
branch = true
source = ["openalpha_cn"]

[tool.coverage.report]
show_missing = true
skip_covered = true
