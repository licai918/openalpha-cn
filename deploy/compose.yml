name: openalpha-cn

services:
  openalpha:
    build:
      context: ..
      dockerfile: Dockerfile
    image: openalpha-cn:local
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:${OPENALPHA_PORT:-8000}:8000"
    environment:
      OPENALPHA_RUNTIME_DIR: /data
      OPENALPHA_WEB_DIR: /app/web-dist
      OPENALPHA_MAX_REQUEST_BYTES: ${OPENALPHA_MAX_REQUEST_BYTES:-8388608}
      # User-owned data provider credentials (see .env.example). Each uses a `:-`
      # default so an unset host/`.env` variable still leaves `docker compose config`
      # well-formed; Compose substitutes from the host shell environment first, then
      # from a project `.env` file, so the same variable a user exports or puts in
      # `.env` before `docker compose up` reaches the container either way.
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      CHAINLIN_API_BASE_URL: ${CHAINLIN_API_BASE_URL:-}
      CHAINLIN_API_KEY: ${CHAINLIN_API_KEY:-}
      # Optional model providers (see .env.example)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      CUSTOM_MODEL_BASE_URL: ${CUSTOM_MODEL_BASE_URL:-}
      CUSTOM_MODEL_API_KEY: ${CUSTOM_MODEL_API_KEY:-}
    volumes:
      - openalpha-runtime:/data
    # 64 MB, unchanged, and `shm_size` deliberately unset -- both re-measured by V2-P4-015
    # against the seam audit's F84, which asks for them to be enlarged.
    #
    # Nothing this image ships writes to either. `/tmp` is reached by no module under
    # `src/` (no `tempfile`, no `TMPDIR` consumer) and `/dev/shm` exists, writable, at
    # Docker's own 64 MB default -- F84 says there is none, and `grep /dev/shm
    # /proc/mounts` inside the running container says otherwise. So a number raised here
    # would be a number nobody measured, for a consumer that does not exist: the joblib
    # spill F84 names arrives only with the dependency ADR-0003's V2-P4-015 section
    # declined.
    #
    # The spill that IS real belongs to the DuckDB this repository already ships, it does
    # not land in either of these, and enlarging a tmpfs is the wrong fix for it because a
    # tmpfs is RAM. See the `WORKDIR /data` comment in the Dockerfile for the three-way
    # reproduction and the fix.
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  openalpha-runtime:
