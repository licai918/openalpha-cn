# Import-layering baseline for ADR-0001's guardrail:
# "Domain and provider contracts must not import SQLite or DuckDB implementation types."
#
# This file is the human-readable, hand-maintained record of every currently-known
# violation of the layering rules enforced by import-linter (see `[tool.importlinter]`
# in `pyproject.toml`). It is not generated by any tool.
#
# Rules:
# - Each violation below MUST also appear as an `ignore_imports` entry on the matching
#   contract in `pyproject.toml` (enforced by
#   `tests/unit/test_import_layering.py::test_baseline_exemptions_match_import_linter_ignore_imports_configuration_exactly`).
# - The count of `[[violation]]` entries is pinned at exactly 0 by
#   `tests/unit/test_import_layering.py::test_baseline_exemption_count_is_pinned_at_zero`.
#   THE BASELINE MUST ONLY SHRINK. A new violation must be fixed, never added here.
# - When a violation is fixed (P0.B work), delete its entry here AND remove the matching
#   `ignore_imports` line from `pyproject.toml` in the same commit, then lower the pinned
#   count in the test above.
#
# History:
# - V2-P0B-011 (2 entries: providers.file -> duckdb, models.governance -> sqlite3) fixed
#   both; the pinned count dropped from 7 to 5.
# - V2-P0B-012 (the remaining 5 entries, all `storage-no-upward-deps`: storage.memory ->
#   runtime.memory, storage.portfolio -> backtest.portfolio, storage.batch ->
#   runtime.batch, storage.recovery -> agents.base, storage.product -> product.research)
#   fixed all 5. Each was `storage/*.py` importing one data contract from above it purely
#   to serialize/deserialize it; every one of those contracts moved to `openalpha_cn.domain`
#   (four of them) or, for `BatchResearchTask`/`BatchProgressEvent`, a new neutral
#   top-level module `openalpha_cn.batch_contracts` (durable orchestration state, not a
#   domain concept -- see that module's docstring). The pinned count dropped from 5 to 0,
#   and `storage-no-upward-deps` no longer declares `ignore_imports` at all (not even an
#   empty list) in `pyproject.toml`.
# - Critical-review follow-up on V2-P0B-012: that fix also added
#   `allow_indirect_imports = true` to `storage-no-upward-deps` in `pyproject.toml`, to
#   tolerate a real two-hop chain (`storage.batch -> batch_contracts -> runtime.contracts`)
#   that `batch_contracts.py` needed for `ResearchRunRequest`. A review rejected that: the
#   flag scopes the contract to a direct-edges-only check instead of import-linter's default
#   full transitive reachability, and a probe proved the gap was real -- a neutral top-level
#   module importing a behavioural `product` class, reached in turn from a module under
#   `storage/`, passed the relaxed contract (`lint-imports` reported it KEPT) while `grimp`'s
#   full reachability check saw the chain plainly. No baseline entry was ever added for this
#   (the flag was a contract-level relaxation, not a per-module exemption, so it never
#   qualified as a `[[violation]]` row here) -- noted for the historical record only. The fix
#   moved `ResearchRunRequest` out of `runtime/contracts.py` into
#   `openalpha_cn.domain.run_request` (`runtime/contracts.py` re-exports it unchanged, same
#   class object), removing `batch_contracts.py`'s only edge into `openalpha_cn.runtime`
#   entirely; `allow_indirect_imports = true` was deleted, and `storage-no-upward-deps` now
#   runs the default full-transitive-reachability check with zero exemptions. See
#   `tests/unit/test_import_layering.py::test_storage_no_upward_deps_contract_does_not_relax_to_direct_edges_only`
#   and `::test_storage_no_upward_deps_contract_rejects_indirect_leak_via_neutral_module`
#   (which reproduces the reviewer's exact probe and proves the gate now rejects it).
#
# The baseline is empty today: every contract in `pyproject.toml` is fully compliant with
# no exemptions.
